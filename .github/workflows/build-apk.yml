# متجر آل عبده - بناء تطبيق أندرويد أوتوماتيك على سيرفرات GitHub.
# التطبيق بيفتح الموقع الحقيقي https://alabdo-toys.com جوه برنامج مستقل
# (Trusted Web Activity)، فأي تعديل في الموقع بيظهر في التطبيق على طول.
#
# الملف ده بيعمل لوحده أول ما يترفع:
#   1) بيضيف .well-known/assetlinks.json (عشان التطبيق يفتح من غير شريط عنوان)
#   2) بيطبّق تصحيح خصم مخزون أحجام العلب في functions/api (مرة واحدة بس)
#   3) بيبني ملف الـ APK ويحطه في فرع apk-build (من غير توقيع - التوقيع
#      بيحصل برّه بمفتاح المتجر الخاص عشان المفتاح ميترفعش على الإنترنت)
# وتقدر تشغّله تاني يدوي من Actions ← Build Android APK ← Run workflow.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Site setup (assetlinks + sizes stock fix)
        run: |
          set -e
          mkdir -p .well-known
          cat > .well-known/assetlinks.json <<'EOF'
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.alabdotoys.app",
                "sha256_cert_fingerprints": ["1B:5C:20:B0:FD:63:22:72:FB:99:E8:82:DB:98:41:43:C5:61:79:2C:2E:9E:2A:33:B2:46:80:CF:67:D6:5F:66"]
              }
            }
          ]
          EOF

          python3 - <<'EOF'
          # تصحيح لمرة واحدة: خصم مخزون كل حجم علبة لوحده لما العميل يطلب،
          # وحفظ اسم الحجم في طلبات "أعلمني عند التوفر". لو اتطبق قبل كده
          # (أو الملف اتغيّر) مبيعملش حاجة.
          p = "functions/api/orders.js"
          s = open(p, encoding="utf-8").read()
          old = ('        var colorName = String(it.colorName || "").trim();\n'
                 '        var qty = Math.max(0, +it.qty || 0);\n'
                 '        if(colorName && Array.isArray(p.colors)){')
          new = ('        var colorName = String(it.colorName || "").trim();\n'
                 '        var sizeLabel = String(it.sizeLabel || "").trim();\n'
                 '        var qty = Math.max(0, +it.qty || 0);\n'
                 '        /* أحجام العلب (p.sizes): كل حجم له كميته الخاصة، فبنخصم من الحجم\n'
                 '           اللي العميل اختاره بالظبط. */\n'
                 '        if(sizeLabel && Array.isArray(p.sizes) && p.sizes.length){\n'
                 '          var s = p.sizes.find(function(x){ return x.label === sizeLabel; });\n'
                 '          if(s && s.stock != null){ s.stock = Math.max(0, (+s.stock||0) - qty); changed = true; }\n'
                 '        } else if(colorName && Array.isArray(p.colors)){')
          if "sizeLabel" not in s and old in s:
              open(p, "w", encoding="utf-8").write(s.replace(old, new))
              print("orders.js patched")
          else:
              print("orders.js: nothing to do")

          p = "functions/api/stock-requests.js"
          s = open(p, encoding="utf-8").read()
          old = '    colorName: (body.colorName || "").trim() || null,\n'
          new = old + '    sizeLabel: (body.sizeLabel || "").trim() || null,\n'
          if "sizeLabel" not in s and old in s:
              open(p, "w", encoding="utf-8").write(s.replace(old, new))
              print("stock-requests.js patched")
          else:
              print("stock-requests.js: nothing to do")
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known/assetlinks.json functions/api/orders.js functions/api/stock-requests.js
          if git diff --cached --quiet; then
            echo "site already set up"
          else
            git commit -m "Android app: assetlinks + box-size stock fix"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Python (for icons)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Android project
        run: |
          set -e
          P="$RUNNER_TEMP/android-app"
          echo "P=$P" >> "$GITHUB_ENV"
          mkdir -p $P/app/src/main/res/values $P/app/src/main/res/xml $P/app/src/main/res/drawable $P/app/src/main/res/mipmap-anydpi-v26

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AlAbdoToys"
          include ":app"
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.alabdotoys.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.alabdotoys.app'
                  minSdk 21
                  targetSdk 35
                  versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
                  versionName '1.0.' + (System.getenv('APP_VERSION_CODE') ?: '1')
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.support.customtabs.action.CustomTabsService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements" />

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="https://alabdo-toys.com/" />
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/colorPrimary" />
                      <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR" android:resource="@color/navigationColor" />
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE" android:resource="@drawable/splash" />
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR" android:resource="@color/backgroundColor" />
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION" android:value="300" />
                      <meta-data android:name="android.support.customtabs.trusted.FILE_PROVIDER_AUTHORITY" android:value="com.alabdotoys.app.fileprovider" />
                      <meta-data android:name="android.support.customtabs.trusted.FALLBACK_STRATEGY" android:value="webview" />
                      <meta-data android:name="android.support.customtabs.trusted.SCREEN_ORIENTATION" android:value="portrait" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="alabdo-toys.com" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.WebViewFallbackActivity"
                      android:configChanges="orientation|screenSize" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.alabdotoys.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/filepaths" />
                  </provider>

                  <service
                      android:name="com.google.androidbrowserhelper.trusted.DelegationService"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">متجر آل عبده</string>
              <string name="asset_statements" translatable="false">[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://alabdo-toys.com\"}}]</string>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#EE1F6C</color>
              <color name="navigationColor">#FFFFFF</color>
              <color name="backgroundColor">#FFF8EF</color>
              <color name="iconBackground">#FFF8EF</color>
          </resources>
          EOF

          cat > $P/app/src/main/res/xml/filepaths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="twa_splash" path="twa_splash/" />
          </paths>
          EOF

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/iconBackground" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      - name: Generate icons from the site's icons
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          import os
          from PIL import Image
          res = os.path.join(os.environ["P"], "app/src/main/res")
          legacy = Image.open("icon-512.png").convert("RGBA")
          maskable = Image.open("icon-maskable-512.png").convert("RGBA")
          dens = {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}
          for name, f in dens.items():
              d = os.path.join(res, "mipmap-" + name)
              os.makedirs(d, exist_ok=True)
              legacy.resize((round(48 * f), round(48 * f)), Image.LANCZOS).save(os.path.join(d, "ic_launcher.png"))
              maskable.resize((round(108 * f), round(108 * f)), Image.LANCZOS).save(os.path.join(d, "ic_launcher_foreground.png"))
          legacy.resize((288, 288), Image.LANCZOS).save(os.path.join(res, "drawable", "splash.png"))
          print("icons ok")
          EOF

      - name: Build APK (unsigned)
        run: |
          set -o pipefail
          cd "$P"
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Align APK and publish to branch apk-build
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools $BT"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$P/app/build/outputs/apk/release/app-release-unsigned.apk" "$OUT/alabdo-toys-unsigned.apk"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c -p 4 "$OUT/alabdo-toys-unsigned.apk"
          cp "$ANDROID_HOME/build-tools/$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          echo "ok run ${{ github.run_number }} build-tools $BT $(date -u)" > "$OUT/info.txt"
          tail -n 60 "$RUNNER_TEMP/build.log" > "$OUT/build.log"
          cd "$OUT"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/apk-build

      - name: Save build log on failure (branch apk-build)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logrepo" && cd "$RUNNER_TEMP/logrepo"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$RUNNER_TEMP/build.log" ]; then tail -n 400 "$RUNNER_TEMP/build.log" > build.log; else echo "failed before the Gradle build step" > build.log; fi
          echo "FAILED run ${{ github.run_number }} at $(date -u)" > info.txt
          git add . && git commit -q -m "build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/apk-build
