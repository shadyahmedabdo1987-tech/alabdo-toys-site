# آل عبده - الإدارة: بناء تطبيق لوحة التحكم أوتوماتيك على سيرفرات GitHub.
# التطبيق بيفتح لوحة تحكم المتجر جوه متصفح داخلي خاص بيه (WebView) - من غير
# جوجل كروم خالص، فمفيش أي رسالة من كروم أول مرة. تطبيق منفصل عن تطبيق
# العملاء (com.alabdotoys.admin)، أيقونته عليها ترس، ولموبايلك إنت بس
# (مش بيترفع على جوجل بلاي).
# بيبني ملف APK من غير توقيع ويحطه في فرع admin-apk-build - التوقيع بيحصل
# برّه بمفتاح المتجر عشان المفتاح ميترفعش على الإنترنت أبدًا.
# وتقدر تشغّله تاني يدوي من Actions ← Build Admin APK ← Run workflow.

name: Build Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-admin-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-admin-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Python (for icons)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Android project
        run: |
          set -e
          P="$RUNNER_TEMP/android-admin"
          echo "P=$P" >> "$GITHUB_ENV"
          mkdir -p $P/app/src/main/java/com/alabdotoys/admin $P/app/src/main/res/values $P/app/src/main/res/values-v31 $P/app/src/main/res/xml $P/app/src/main/res/drawable $P/app/src/main/res/drawable-xxxhdpi $P/app/src/main/res/mipmap-anydpi-v26

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AlAbdoAdmin"
          include ":app"
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.alabdotoys.admin'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.alabdotoys.admin'
                  minSdk 23
                  targetSdk 36
                  versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
                  versionName '2.0.' + (System.getenv('APP_VERSION_CODE') ?: '1')
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:enableOnBackInvokedCallback="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".StockWatchJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">آل عبده - الإدارة</string>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="brandPink">#1B2440</color>
              <color name="splashBg">#1B2440</color>
              <color name="iconBackground">#FFF8EF</color>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash_bg</item>
                  <item name="android:statusBarColor">@color/brandPink</item>
                  <item name="android:colorPrimary">@color/brandPink</item>
                  <item name="android:colorAccent">@color/brandPink</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/values-v31/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/splashBg</item>
                  <item name="android:statusBarColor">@color/brandPink</item>
                  <item name="android:colorPrimary">@color/brandPink</item>
                  <item name="android:colorAccent">@color/brandPink</item>
                  <item name="android:windowSplashScreenBackground">@color/splashBg</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/drawable/splash_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/splashBg" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/splash_logo" />
              </item>
          </layer-list>
          EOF

          cat > $P/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="camera" path="camera/" />
              <cache-path name="exports" path="exports/" />
          </paths>
          EOF

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/iconBackground" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > $P/app/src/main/java/com/alabdotoys/admin/MainActivity.java <<'EOF'
          package com.alabdotoys.admin;

          import android.animation.ObjectAnimator;
          import android.animation.ValueAnimator;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Insets;
          import android.net.Uri;
          import android.os.Build;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.animation.LinearInterpolator;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.window.OnBackInvokedDispatcher;

          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.util.ArrayList;

          /* آل عبده - الإدارة: لوحة تحكم المتجر جوه متصفح داخلي خاص بيها (WebView)
             من غير جوجل كروم خالص، فمفيش أي رسالة من كروم بتظهر أول مرة.
             - زرار "نسخة احتياطية" بيحفظ الملف في فولدر Downloads على الموبايل
               (عن طريق AlAbdoNative.saveFile).
             - لينكات الموقع بتفتح جوه التطبيق، وأي لينك برّه (واتساب، تليفون،
               فيسبوك...) بيفتح في التطبيق المناسب على الموبايل.
             - رفع الصور (زي سكرين شوت التحويل) من المعرض أو الكاميرا.
             - زرار الرجوع بيرجع خطوة جوه الموقع قبل ما يقفل التطبيق. */
          public class MainActivity extends Activity {
              private static final String HOST = "alabdo-toys.com";
              private static final String HOME = "https://alabdo-toys.com/?source=admin#ld2Hmke8ryGU7G5QRI56vgwE58fe";
              private static final int REQ_FILE = 1001;

              private WebView web;
              private View topBar, bottomBar, splash;
              private ValueCallback<Uri[]> fileCallback;
              private Uri cameraUri;
              private boolean splashHidden = false;
              private ObjectAnimator splashSpin;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  boolean night = (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
                  int bottomColor = night ? 0xFF181E33 : 0xFFFFFFFF;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF1B2440);
                  topBar = new View(this);
                  topBar.setBackgroundColor(night ? 0xFF121829 : 0xFF1B2440);
                  bottomBar = new View(this);
                  bottomBar.setBackgroundColor(bottomColor);
                  FrameLayout content = new FrameLayout(this);
                  web = new WebView(this);
                  web.setBackgroundColor(night ? 0xFF0E1220 : 0xFFF3F4F9);
                  content.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  splash = buildSplash();
                  content.addView(splash, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  root.addView(topBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0));
                  root.addView(content, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  root.addView(bottomBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0));
                  setContentView(root);

                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                      root.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                          @Override
                          public WindowInsets onApplyWindowInsets(View v, WindowInsets insets) {
                              Insets sys = insets.getInsets(WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout());
                              Insets ime = insets.getInsets(WindowInsets.Type.ime());
                              setHeight(topBar, sys.top);
                              setHeight(bottomBar, Math.max(sys.bottom, ime.bottom));
                              v.setPadding(sys.left, 0, sys.right, 0);
                              return WindowInsets.CONSUMED;
                          }
                      });
                      WindowInsetsController c = w.getInsetsController();
                      if (c != null) {
                          int mask = WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS | WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS;
                          c.setSystemBarsAppearance(night ? 0 : WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS, mask);
                      }
                  } else {
                      w.setStatusBarColor(night ? 0xFF121829 : 0xFF1B2440);
                      if (Build.VERSION.SDK_INT >= 26) {
                          w.setNavigationBarColor(bottomColor);
                          if (!night) w.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
                      } else {
                          w.setNavigationBarColor(Color.BLACK);
                      }
                  }

                  setupWebView();

                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(OnBackInvokedDispatcher.PRIORITY_DEFAULT, new android.window.OnBackInvokedCallback() {
                          @Override
                          public void onBackInvoked() { goBackOrClose(); }
                      });
                  }

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(startUrl(getIntent()));
                  }
                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override public void run() { hideSplash(); }
                  }, 15000);
              }

              private View buildSplash() {
                  FrameLayout f = new FrameLayout(this);
                  f.setBackgroundColor(0xFF1B2440);
                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.splash_logo);
                  float density = getResources().getDisplayMetrics().density;
                  int size = (int) (140 * density);
                  f.addView(logo, new FrameLayout.LayoutParams(size, size, Gravity.CENTER));
                  f.setClickable(true);
                  /* اللوجو بيلف حوالين نفسه لحد ما البيانات تحمل (appReady) */
                  logo.setCameraDistance(9000 * density);
                  splashSpin = ObjectAnimator.ofFloat(logo, "rotationY", 0f, 360f);
                  splashSpin.setDuration(2000);
                  splashSpin.setInterpolator(new LinearInterpolator());
                  splashSpin.setRepeatCount(ValueAnimator.INFINITE);
                  splashSpin.setRepeatMode(ValueAnimator.RESTART);
                  splashSpin.start();
                  return f;
              }

              private void hideSplash() {
                  if (splashHidden || splash == null) return;
                  splashHidden = true;
                  splash.animate().alpha(0f).setDuration(300).withEndAction(new Runnable() {
                      @Override public void run() {
                          splash.setVisibility(View.GONE);
                          if (splashSpin != null) splashSpin.cancel();
                      }
                  }).start();
              }

              private static void setHeight(View v, int h) {
                  ViewGroup.LayoutParams lp = v.getLayoutParams();
                  if (lp != null && lp.height != h) { lp.height = h; v.setLayoutParams(lp); }
              }

              private String startUrl(Intent intent) {
                  /* جاي من إشعار المخزون: نفتح المنتجات على فلتر "خلصت" أو "قربت تخلص" */
                  String f = intent != null ? intent.getStringExtra("admf") : null;
                  if ("out".equals(f) || "low".equals(f)) return HOME.replace("?source=admin", "?source=admin&admf=" + f);
                  return HOME;
              }

              /* أندرويد 13 وأحدث: لازم توافق على الإشعارات (بنسأل مرة واحدة) */
              private void askNotificationPermissionOnce() {
                  if (Build.VERSION.SDK_INT < 33) return;
                  if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED) return;
                  android.content.SharedPreferences sp = getSharedPreferences(StockWatchJob.PREFS, MODE_PRIVATE);
                  if (sp.getBoolean("asked_notif", false)) return;
                  sp.edit().putBoolean("asked_notif", true).apply();
                  requestPermissions(new String[]{ Manifest.permission.POST_NOTIFICATIONS }, 2001);
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  askNotificationPermissionOnce();
                  try { StockWatchJob.ensureScheduled(this); } catch (Exception e) { /* ignore */ }
              }

              private static boolean isOwnSite(Uri u) {
                  String scheme = u.getScheme();
                  String host = u.getHost();
                  return ("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme))
                      && host != null && (host.equalsIgnoreCase(HOST) || host.toLowerCase().endsWith("." + HOST));
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setTextZoom(100);
                  s.setSupportZoom(false);
                  s.setAllowFileAccess(false);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUserAgentString(s.getUserAgentString() + " AlAbdoAdmin/4");
                  CookieManager.getInstance().setAcceptCookie(true);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl());
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          /* نسخة قديمة من الموقع (من غير appReady)؟ نقفل الشاشة على طول */
                          if (splashHidden) return;
                          view.evaluateJavascript("window.AA_SPLASH===1", new ValueCallback<String>() {
                              @Override public void onReceiveValue(String v) { if (!"true".equals(v)) hideSplash(); }
                          });
                      }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) showOffline();
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          return openFileChooser(callback, params);
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> openExternal(Uri.parse(url)));
                  web.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void saveFile(final String name, final String mime, final String content) {
                          runOnUiThread(new Runnable() { @Override public void run() { saveToDownloads(name, mime, content); } });
                      }
                      @android.webkit.JavascriptInterface
                      public void appReady() {
                          runOnUiThread(new Runnable() { @Override public void run() { hideSplash(); } });
                      }
                  }, "AlAbdoNative");
              }

              /* حفظ ملف النسخة الاحتياطية: في Downloads على أندرويد 10 وأحدث،
                 ولأقدم من كده بيفتح قايمة المشاركة (تحفظه في Drive أو تبعته لنفسك). */
              private void saveToDownloads(String name, String mime, String content) {
                  String safeName = (name == null || name.isEmpty()) ? "alabdo-backup.json" : name.replaceAll("[\\/:*?\"<>|]", "_");
                  String type = (mime == null || mime.isEmpty()) ? "application/json" : mime;
                  byte[] data = content == null ? new byte[0] : content.getBytes(java.nio.charset.StandardCharsets.UTF_8);
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          android.content.ContentValues v = new android.content.ContentValues();
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                          v.put(MediaStore.MediaColumns.MIME_TYPE, type);
                          v.put(MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (uri == null) throw new java.io.IOException("insert failed");
                          java.io.OutputStream os = getContentResolver().openOutputStream(uri);
                          if (os == null) throw new java.io.IOException("open failed");
                          try { os.write(data); } finally { os.close(); }
                          android.widget.Toast.makeText(this, "✅ اتحفظت النسخة الاحتياطية في فولدر Downloads: " + safeName, android.widget.Toast.LENGTH_LONG).show();
                      } else {
                          File dir = new File(getCacheDir(), "exports");
                          if (!dir.exists()) dir.mkdirs();
                          File f = new File(dir, safeName);
                          java.io.FileOutputStream fos = new java.io.FileOutputStream(f);
                          try { fos.write(data); } finally { fos.close(); }
                          Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                          Intent send = new Intent(Intent.ACTION_SEND);
                          send.setType(type);
                          send.putExtra(Intent.EXTRA_STREAM, uri);
                          send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          startActivity(Intent.createChooser(send, "احفظ النسخة الاحتياطية"));
                      }
                  } catch (Exception e) {
                      android.widget.Toast.makeText(this, "⚠️ معرفناش نحفظ الملف، جرّب تاني", android.widget.Toast.LENGTH_LONG).show();
                  }
              }

              /* لينكات الموقع بتفضل جوه التطبيق، وأي حاجة تانية بتفتح برّه */
              private boolean handleUrl(Uri u) {
                  if (u == null) return false;
                  if (isOwnSite(u)) return false;
                  String scheme = u.getScheme() == null ? "" : u.getScheme().toLowerCase();
                  if (scheme.equals("intent")) {
                      try {
                          Intent i = Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME);
                          try { startActivity(i); }
                          catch (ActivityNotFoundException e) {
                              String fb = i.getStringExtra("browser_fallback_url");
                              if (fb != null) openExternal(Uri.parse(fb));
                          }
                      } catch (Exception e) { /* ignore */ }
                      return true;
                  }
                  openExternal(u);
                  return true;
              }

              private void openExternal(Uri u) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, u);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) { /* no app for this link */ }
              }

              private void showOffline() {
                  String html = "<!doctype html><html dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>"
                      + "<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;"
                      + "font-family:sans-serif;background:#fff8ef;color:#2a1f3d;text-align:center;padding:24px;box-sizing:border-box}"
                      + "b{font-size:20px}p{margin:0;color:#6b6080}button{border:0;border-radius:999px;background:#ee1f6c;color:#fff;font-size:16px;font-weight:700;padding:12px 28px}</style></head>"
                      + "<body><div style='font-size:52px'>📶</div><b>مفيش اتصال بالإنترنت</b><p>اتأكد إن النت شغال وجرّب تاني</p>"
                      + "<button onclick=\"location.href='" + HOME + "'\">حاول تاني</button></body></html>";
                  web.loadDataWithBaseURL(null, html, "text/html", "utf-8", null);
                  hideSplash();
              }

              /* اختيار صورة (سكرين شوت التحويل مثلاً) من المعرض أو تصويرها بالكاميرا */
              private boolean openFileChooser(ValueCallback<Uri[]> callback, WebChromeClient.FileChooserParams params) {
                  if (fileCallback != null) fileCallback.onReceiveValue(null);
                  fileCallback = callback;
                  boolean imagesOnly = true;
                  String[] types = params.getAcceptTypes();
                  if (types != null) {
                      for (String t : types) {
                          if (t != null && t.length() > 0 && !t.startsWith("image")) { imagesOnly = false; break; }
                      }
                  }
                  Intent pick = new Intent(Intent.ACTION_GET_CONTENT);
                  pick.addCategory(Intent.CATEGORY_OPENABLE);
                  pick.setType(imagesOnly ? "image/*" : "*/*");
                  if (params.getMode() == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE) {
                      pick.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  }
                  Intent camera = null;
                  cameraUri = null;
                  if (imagesOnly) {
                      try {
                          File dir = new File(getCacheDir(), "camera");
                          if (!dir.exists()) dir.mkdirs();
                          File photo = File.createTempFile("photo_", ".jpg", dir);
                          cameraUri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", photo);
                          camera = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                          camera.putExtra(MediaStore.EXTRA_OUTPUT, cameraUri);
                          camera.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception e) { camera = null; cameraUri = null; }
                  }
                  Intent launch;
                  if (params.isCaptureEnabled() && camera != null) {
                      launch = camera;
                  } else {
                      launch = Intent.createChooser(pick, "اختار صورة");
                      if (camera != null) {
                          ArrayList<Intent> extra = new ArrayList<>();
                          extra.add(camera);
                          launch.putExtra(Intent.EXTRA_INITIAL_INTENTS, extra.toArray(new Intent[0]));
                      }
                  }
                  try {
                      startActivityForResult(launch, REQ_FILE);
                  } catch (ActivityNotFoundException e) {
                      fileCallback = null;
                      return false;
                  }
                  return true;
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILE) {
                      if (fileCallback == null) return;
                      Uri[] result = null;
                      if (resultCode == RESULT_OK) {
                          if (data != null && data.getClipData() != null && data.getClipData().getItemCount() > 0) {
                              int n = data.getClipData().getItemCount();
                              result = new Uri[n];
                              for (int i = 0; i < n; i++) result[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data != null && data.getData() != null) {
                              result = new Uri[]{ data.getData() };
                          } else if (cameraUri != null) {
                              result = new Uri[]{ cameraUri };
                          }
                      }
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              private void goBackOrClose() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else finish();
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  /* تطبيق الإدارة مش بيستقبل لينكات من برّه - بس إشعارات المخزون بتفتح
                     المنتجات على الفلتر المناسب */
                  String f = intent != null ? intent.getStringExtra("admf") : null;
                  if ("out".equals(f) || "low".equals(f)) {
                      web.evaluateJavascript("window.admOpenFilter && admOpenFilter('" + f + "')", null);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }

              @Override
              protected void onPause() {
                  web.onPause();
                  CookieManager.getInstance().flush();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) { web.stopLoading(); web.destroy(); }
                  super.onDestroy();
              }
          }
          EOF

          cat > $P/app/src/main/java/com/alabdotoys/admin/StockWatchJob.java <<'EOF'
          package com.alabdotoys.admin;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.job.JobInfo;
          import android.app.job.JobParameters;
          import android.app.job.JobScheduler;
          import android.app.job.JobService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.Set;

          /* مراقبة المخزون في الخلفية (تطبيق الإدارة بس):
             كل ربع ساعة تقريبًا (أندرويد بيحدد الوقت بالظبط عشان البطارية) بيشوف
             كميات المنتجات من /api/stock، ولو منتج خلص أو وصل لحد التنبيه بتاعه
             بيطلع إشعار باسم المنتج - مرة واحدة لكل تغيير (مش كل ربع ساعة). ولو
             المنتج اتزوّد تاني الإشعار بتاعه بيتشال. */
          public class StockWatchJob extends JobService {
              static final String PREFS = "alabdo_stock_watch";
              static final int JOB_PERIODIC = 201, JOB_NOW = 202;
              static final String CH_OUT = "stock_out", CH_LOW = "stock_low";
              static final String GROUP = "alabdo_stock";
              static final int SUMMARY_ID = 900;
              static final String URL_STOCK = "https://alabdo-toys.com/api/stock";

              /* بتتنادى كل ما التطبيق يفتح: تتأكد إن المراقبة شغالة + تشيك دلوقتي */
              static void ensureScheduled(Context c) {
                  JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                  if (js == null) return;
                  ComponentName cn = new ComponentName(c, StockWatchJob.class);
                  boolean has = false;
                  if (Build.VERSION.SDK_INT >= 24) has = js.getPendingJob(JOB_PERIODIC) != null;
                  else for (JobInfo j : js.getAllPendingJobs()) if (j.getId() == JOB_PERIODIC) has = true;
                  if (!has) {
                      js.schedule(new JobInfo.Builder(JOB_PERIODIC, cn)
                          .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                          .setPeriodic(15L * 60L * 1000L)
                          .setPersisted(true)
                          .build());
                  }
                  js.schedule(new JobInfo.Builder(JOB_NOW, cn)
                      .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                      .setOverrideDeadline(60L * 1000L)
                      .build());
              }

              @Override
              public boolean onStartJob(final JobParameters params) {
                  new Thread(new Runnable() {
                      @Override public void run() {
                          boolean retry = false;
                          try { check(getApplicationContext()); }
                          catch (Exception e) { retry = params.getJobId() == JOB_NOW; }
                          jobFinished(params, retry);
                      }
                  }).start();
                  return true;
              }

              @Override
              public boolean onStopJob(JobParameters params) { return true; }

              private static String fetch() throws Exception {
                  HttpURLConnection con = (HttpURLConnection) new URL(URL_STOCK + "?t=" + System.currentTimeMillis()).openConnection();
                  con.setConnectTimeout(15000);
                  con.setReadTimeout(20000);
                  con.setUseCaches(false);
                  con.setRequestProperty("Cache-Control", "no-cache");
                  con.setRequestProperty("User-Agent", "AlAbdoAdmin/3 stock-watch");
                  try {
                      if (con.getResponseCode() != 200) throw new Exception("http " + con.getResponseCode());
                      InputStream in = con.getInputStream();
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      return out.toString("UTF-8");
                  } finally { con.disconnect(); }
              }

              private static String num(int n) { return String.valueOf(n); }

              /* تفاصيل الكمية في الإشعار: "فاضل 2" أو "علبة 18: 0، علبة 24: 2" */
              private static String detail(JSONObject it, int lim, boolean out) {
                  JSONArray parts = it.optJSONArray("sizes");
                  String key = "label";
                  if (parts == null || parts.length() == 0) { parts = it.optJSONArray("colors"); key = "name"; }
                  if (parts != null && parts.length() > 0) {
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < parts.length(); i++) {
                          JSONObject p = parts.optJSONObject(i);
                          if (p == null || p.isNull("stock")) continue;
                          int st = p.optInt("stock", 0);
                          if (!out && st > lim) continue;
                          if (sb.length() > 0) sb.append("، ");
                          sb.append(p.optString(key, "")).append(": ").append(st <= 0 ? "خلص" : ("فاضل " + num(st)));
                      }
                      return sb.toString();
                  }
                  if (out) return "الكمية خلصت";
                  return "فاضل " + num(it.optInt("stock", 0)) + " بس";
              }

              static void check(Context c) throws Exception {
                  JSONObject res = new JSONObject(fetch());
                  JSONArray items = res.optJSONArray("items");
                  if (items == null) return;
                  int def = res.optInt("lowStock", 3);
                  SharedPreferences sp = c.getSharedPreferences(PREFS, MODE_PRIVATE);
                  JSONObject prev = new JSONObject(sp.getString("states", "{}"));
                  boolean baseline = sp.getBoolean("baseline", false);
                  JSONObject now = new JSONObject();
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  ensureChannels(nm);
                  int outCount = 0, lowCount = 0, posted = 0;
                  Set<String> seen = new HashSet<>();
                  for (int i = 0; i < items.length(); i++) {
                      JSONObject it = items.optJSONObject(i);
                      if (it == null) continue;
                      String id = String.valueOf(it.opt("id"));
                      String state = it.optString("state", "ok");
                      seen.add(id);
                      now.put(id, state);
                      if ("out".equals(state)) outCount++;
                      if ("low".equals(state)) lowCount++;
                      if (!baseline) continue;
                      String was = prev.optString(id, "ok");
                      int nid = notifId(id);
                      String name = it.optString("name", "");
                      int lim = it.isNull("lowAt") ? def : it.optInt("lowAt", def);
                      if ("out".equals(state) && !"out".equals(was)) {
                          post(c, nm, nid, CH_OUT, "⛔ خلص من المخزن: " + name,
                              detail(it, lim, true) + " — العملاء مش هيقدروا يطلبوه، زوّد الكمية.", "out");
                          posted++;
                      } else if ("low".equals(state) && !"low".equals(was) && !"out".equals(was)) {
                          post(c, nm, nid, CH_LOW, "⚠️ قرب يخلص: " + name,
                              detail(it, lim, false) + " (حد التنبيه " + num(lim) + ")", "low");
                          posted++;
                      } else if (("ok".equals(state) || "none".equals(state)) && ("out".equals(was) || "low".equals(was))) {
                          nm.cancel(nid); /* المنتج اتزوّد تاني */
                      }
                  }
                  /* منتجات اتمسحت: نشيل إشعاراتها */
                  Iterator<String> keys = prev.keys();
                  while (keys.hasNext()) { String k = keys.next(); if (!seen.contains(k)) nm.cancel(notifId(k)); }

                  if (!baseline) {
                      /* أول مرة: ملخص واحد بدل إشعار لكل منتج */
                      if (outCount + lowCount > 0) {
                          String txt = (outCount > 0 ? num(outCount) + " منتج خلص من المخزن" : "")
                              + (outCount > 0 && lowCount > 0 ? "، و" : "")
                              + (lowCount > 0 ? num(lowCount) + " منتج قرب يخلص" : "");
                          post(c, nm, SUMMARY_ID + 1, outCount > 0 ? CH_OUT : CH_LOW, "📦 حالة المخزون", txt + ". دوس عشان تشوفهم.", outCount > 0 ? "out" : "low");
                      }
                      sp.edit().putBoolean("baseline", true).putString("states", now.toString()).apply();
                      return;
                  }
                  if (posted > 1 && Build.VERSION.SDK_INT >= 24) {
                      Notification.Builder s = builder(c, outCount > 0 ? CH_OUT : CH_LOW)
                          .setContentTitle("📦 تنبيهات المخزون")
                          .setContentText(num(outCount) + " خلصت · " + num(lowCount) + " قربت تخلص")
                          .setGroup(GROUP).setGroupSummary(true).setAutoCancel(true)
                          .setContentIntent(open(c, outCount > 0 ? "out" : "low", SUMMARY_ID));
                      try { nm.notify(SUMMARY_ID, s.build()); } catch (SecurityException e) { /* not allowed */ }
                  }
                  sp.edit().putString("states", now.toString()).apply();
              }

              private static int notifId(String id) { return 1000 + (id.hashCode() & 0x3fff); }

              private static void ensureChannels(NotificationManager nm) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  if (nm.getNotificationChannel(CH_OUT) == null) {
                      NotificationChannel a = new NotificationChannel(CH_OUT, "منتجات خلصت من المخزن", NotificationManager.IMPORTANCE_HIGH);
                      a.setDescription("إشعار لكل منتج كميته خلصت");
                      nm.createNotificationChannel(a);
                  }
                  if (nm.getNotificationChannel(CH_LOW) == null) {
                      NotificationChannel b = new NotificationChannel(CH_LOW, "منتجات قربت تخلص", NotificationManager.IMPORTANCE_DEFAULT);
                      b.setDescription("إشعار لما منتج يوصل لحد التنبيه بتاعه");
                      nm.createNotificationChannel(b);
                  }
              }

              @SuppressWarnings("deprecation")
              private static Notification.Builder builder(Context c, String ch) {
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, ch) : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.ic_stat_notify).setColor(0xFFEE1F6C);
                  if (Build.VERSION.SDK_INT < 26) b.setPriority(CH_OUT.equals(ch) ? Notification.PRIORITY_HIGH : Notification.PRIORITY_DEFAULT);
                  return b;
              }

              private static PendingIntent open(Context c, String filter, int req) {
                  Intent i = new Intent(c, MainActivity.class);
                  i.putExtra("admf", filter);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(c, req, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static void post(Context c, NotificationManager nm, int id, String ch, String title, String text, String filter) {
                  Notification.Builder b = builder(c, ch)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(new Notification.BigTextStyle().bigText(text))
                      .setAutoCancel(true)
                      .setContentIntent(open(c, filter, id));
                  if (Build.VERSION.SDK_INT >= 24) b.setGroup(GROUP);
                  try { nm.notify(id, b.build()); } catch (SecurityException e) { /* not allowed */ }
              }
          }
