          package com.alabdotoys.admin;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.job.JobInfo;
          import android.app.job.JobParameters;
          import android.app.job.JobScheduler;
          import android.app.job.JobService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.Set;

          /* مراقبة المخزون في الخلفية (تطبيق الإدارة بس):
             كل ربع ساعة تقريبًا (أندرويد بيحدد الوقت بالظبط عشان البطارية) بيشوف
             كميات المنتجات من /api/stock، ولو منتج خلص أو وصل لحد التنبيه بتاعه
             بيطلع إشعار باسم المنتج - مرة واحدة لكل تغيير (مش كل ربع ساعة). ولو
             المنتج اتزوّد تاني الإشعار بتاعه بيتشال. */
          public class StockWatchJob extends JobService {
              static final String PREFS = "alabdo_stock_watch";
              static final int JOB_PERIODIC = 201, JOB_NOW = 202;
              static final String CH_OUT = "stock_out", CH_LOW = "stock_low";
              static final String GROUP = "alabdo_stock";
              static final int SUMMARY_ID = 900;
              static final String URL_STOCK = "https://alabdo-toys.com/api/stock";
              static final String URL_FEED = "https://alabdo-toys.com/api/admin/feed";
              static final String CH_ORDERS = "new_orders", CH_MSGS = "customer_msgs";

              /* مفتاح الإشعارات (بياخده التطبيق بعد تسجيل الدخول - بيقرا الجديد بس) */
              static void setNotifyToken(Context c, String token) {
                  SharedPreferences.Editor e = c.getSharedPreferences(PREFS, MODE_PRIVATE).edit();
                  if (token == null || token.isEmpty()) e.remove("notify_token");
                  else e.putString("notify_token", token).putBoolean("feed_baseline", false);
                  e.apply();
              }
              static String getNotifyToken(Context c) {
                  return c.getSharedPreferences(PREFS, MODE_PRIVATE).getString("notify_token", "");
              }

              /* بتتنادى كل ما التطبيق يفتح: تتأكد إن المراقبة شغالة + تشيك دلوقتي */
              static void ensureScheduled(Context c) {
                  JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                  if (js == null) return;
                  ComponentName cn = new ComponentName(c, StockWatchJob.class);
                  boolean has = false;
                  if (Build.VERSION.SDK_INT >= 24) has = js.getPendingJob(JOB_PERIODIC) != null;
                  else for (JobInfo j : js.getAllPendingJobs()) if (j.getId() == JOB_PERIODIC) has = true;
                  if (!has) {
                      js.schedule(new JobInfo.Builder(JOB_PERIODIC, cn)
                          .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                          .setPeriodic(15L * 60L * 1000L)
                          .setPersisted(true)
                          .build());
                  }
                  js.schedule(new JobInfo.Builder(JOB_NOW, cn)
                      .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                      .setOverrideDeadline(60L * 1000L)
                      .build());
              }

              @Override
              public boolean onStartJob(final JobParameters params) {
                  new Thread(new Runnable() {
                      @Override public void run() {
                          boolean ok = runAll(getApplicationContext());
                          jobFinished(params, !ok && params.getJobId() == JOB_NOW);
                      }
                  }).start();
                  return true;
              }

              @Override
              public boolean onStopJob(JobParameters params) { return true; }

              /* المخزون + الطلبات/الاستفسارات/طلبات التوفر/العملاء - واحدة ورا التانية
                 (مش مع بعض، عشان الإشعار ما يطلعش مرتين) */
              /* الطلبات/الاستفسارات كل مرة (كل دقيقة تقريبًا)، والمخزون كل 3 دقايق بس
                 (عشان النت والبطارية) */
              static long lastStockAt = 0;
              static synchronized boolean runAll(Context c) {
                  boolean ok = true;
                  long now = System.currentTimeMillis();
                  if (now - lastStockAt > 3L * 60L * 1000L) {
                      try { check(c); lastStockAt = now; } catch (Exception e) { ok = false; }
                  }
                  try { checkFeed(c); } catch (Exception e) { ok = false; }
                  return ok;
              }

              static class Unauthorized extends Exception {}

              private static String fetch() throws Exception { return fetch(URL_STOCK, null); }

              private static String fetch(String url, String token) throws Exception {
                  HttpURLConnection con = (HttpURLConnection) new URL(url + "?t=" + System.currentTimeMillis()).openConnection();
                  if (token != null) con.setRequestProperty("X-Notify-Token", token);
                  con.setConnectTimeout(10000);
                  con.setReadTimeout(12000);
                  con.setUseCaches(false);
                  con.setRequestProperty("Cache-Control", "no-cache");
                  con.setRequestProperty("User-Agent", "AlAbdoAdmin/3 stock-watch");
                  try {
                      if (con.getResponseCode() == 401) throw new Unauthorized();
                      if (con.getResponseCode() != 200) throw new Exception("http " + con.getResponseCode());
                      InputStream in = con.getInputStream();
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      return out.toString("UTF-8");
                  } finally { con.disconnect(); }
              }

              private static String num(int n) { return String.valueOf(n); }

              /* تفاصيل الكمية في الإشعار: "فاضل 2" أو "علبة 18: 0، علبة 24: 2" */
              private static String detail(JSONObject it, int lim, boolean out) {
                  JSONArray parts = it.optJSONArray("sizes");
                  String key = "label";
                  if (parts == null || parts.length() == 0) { parts = it.optJSONArray("colors"); key = "name"; }
                  if (parts != null && parts.length() > 0) {
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < parts.length(); i++) {
                          JSONObject p = parts.optJSONObject(i);
                          if (p == null || p.isNull("stock")) continue;
                          int st = p.optInt("stock", 0);
                          if (!out && st > lim) continue;
                          if (sb.length() > 0) sb.append("، ");
                          sb.append(p.optString(key, "")).append(": ").append(st <= 0 ? "خلص" : ("فاضل " + num(st)));
                      }
                      return sb.toString();
                  }
                  if (out) return "الكمية خلصت";
                  return "فاضل " + num(it.optInt("stock", 0)) + " بس";
              }

              static void check(Context c) throws Exception {
                  JSONObject res = new JSONObject(fetch());
                  JSONArray items = res.optJSONArray("items");
                  if (items == null) return;
                  int def = res.optInt("lowStock", 3);
                  SharedPreferences sp = c.getSharedPreferences(PREFS, MODE_PRIVATE);
                  JSONObject prev = new JSONObject(sp.getString("states", "{}"));
                  boolean baseline = sp.getBoolean("baseline", false);
                  JSONObject now = new JSONObject();
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  ensureChannels(nm);
                  int outCount = 0, lowCount = 0, posted = 0;
                  Set<String> seen = new HashSet<>();
                  for (int i = 0; i < items.length(); i++) {
                      JSONObject it = items.optJSONObject(i);
                      if (it == null) continue;
                      String id = String.valueOf(it.opt("id"));
                      String state = it.optString("state", "ok");
                      seen.add(id);
                      now.put(id, state);
                      if ("out".equals(state)) outCount++;
                      if ("low".equals(state)) lowCount++;
                      if (!baseline) continue;
                      String was = prev.optString(id, "ok");
                      int nid = notifId(id);
                      String name = it.optString("name", "");
                      int lim = it.isNull("lowAt") ? def : it.optInt("lowAt", def);
                      if ("out".equals(state) && !"out".equals(was)) {
                          post(c, nm, nid, CH_OUT, "⛔ خلص من المخزن: " + name,
                              detail(it, lim, true) + " — العملاء مش هيقدروا يطلبوه، زوّد الكمية.", "out");
                          posted++;
                      } else if ("low".equals(state) && !"low".equals(was) && !"out".equals(was)) {
                          post(c, nm, nid, CH_LOW, "⚠️ قرب يخلص: " + name,
                              detail(it, lim, false) + " (حد التنبيه " + num(lim) + ")", "low");
                          posted++;
                      } else if (("ok".equals(state) || "none".equals(state)) && ("out".equals(was) || "low".equals(was))) {
                          nm.cancel(nid); /* المنتج اتزوّد تاني */
                      }
                  }
                  /* منتجات اتمسحت: نشيل إشعاراتها */
                  Iterator<String> keys = prev.keys();
                  while (keys.hasNext()) { String k = keys.next(); if (!seen.contains(k)) nm.cancel(notifId(k)); }

                  if (!baseline) {
                      /* أول مرة: ملخص واحد بدل إشعار لكل منتج */
                      if (outCount + lowCount > 0) {
                          String txt = (outCount > 0 ? num(outCount) + " منتج خلص من المخزن" : "")
                              + (outCount > 0 && lowCount > 0 ? "، و" : "")
                              + (lowCount > 0 ? num(lowCount) + " منتج قرب يخلص" : "");
                          post(c, nm, SUMMARY_ID + 1, outCount > 0 ? CH_OUT : CH_LOW, "📦 حالة المخزون", txt + ". دوس عشان تشوفهم.", outCount > 0 ? "out" : "low");
                      }
                      sp.edit().putBoolean("baseline", true).putString("states", now.toString()).apply();
                      return;
                  }
                  if (posted > 1 && Build.VERSION.SDK_INT >= 24) {
                      Notification.Builder s = builder(c, outCount > 0 ? CH_OUT : CH_LOW)
                          .setContentTitle("📦 تنبيهات المخزون")
                          .setContentText(num(outCount) + " خلصت · " + num(lowCount) + " قربت تخلص")
                          .setGroup(GROUP).setGroupSummary(true).setAutoCancel(true)
                          .setContentIntent(open(c, outCount > 0 ? "out" : "low", SUMMARY_ID));
                      try { nm.notify(SUMMARY_ID, s.build()); } catch (SecurityException e) { /* not allowed */ }
                  }
                  sp.edit().putString("states", now.toString()).apply();
              }

              private static int notifId(String id) { return 1000 + (id.hashCode() & 0x3fff); }

              /* ---------- طلبات جديدة / استفسارات / طلبات توفّر ---------- */
              static void checkFeed(Context c) throws Exception {
                  SharedPreferences sp = c.getSharedPreferences(PREFS, MODE_PRIVATE);
                  String tok = sp.getString("notify_token", "");
                  if (tok.isEmpty()) return;
                  JSONObject res;
                  try { res = new JSONObject(fetch(URL_FEED, tok)); }
                  catch (Unauthorized u) { sp.edit().remove("notify_token").apply(); return; }
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  ensureChannels(nm);
                  boolean baseline = sp.getBoolean("feed_baseline", false);
                  JSONObject seen = new JSONObject(sp.getString("feed_seen", "{}"));
                  JSONObject nowSeen = new JSONObject();
                  String[] types = { "orders", "inquiries", "stockRequests", "customers" };
                  for (String type : types) {
                      JSONArray items = res.optJSONArray(type);
                      if (items == null) items = new JSONArray();
                      Set<String> old = new HashSet<>();
                      JSONArray oldArr = seen.optJSONArray(type);
                      if (oldArr != null) for (int i = 0; i < oldArr.length(); i++) old.add(oldArr.optString(i));
                      JSONArray ids = new JSONArray();
                      java.util.List<JSONObject> fresh = new java.util.ArrayList<>();
                      for (int i = 0; i < items.length(); i++) {
                          JSONObject it = items.optJSONObject(i);
                          if (it == null) continue;
                          String id = it.optString("id", "");
                          ids.put(id);
                          if (!old.contains(id)) fresh.add(it);
                      }
                      nowSeen.put(type, ids);
                      if (!baseline || fresh.isEmpty()) continue;
                      if (fresh.size() > 4) {
                          String t = "orders".equals(type) ? ("🧾 " + num(fresh.size()) + " طلبات جديدة")
                              : "inquiries".equals(type) ? ("📨 " + num(fresh.size()) + " استفسارات جديدة")
                              : "customers".equals(type) ? ("👤 " + num(fresh.size()) + " عملاء جداد سجّلوا")
                              : ("🔔 " + num(fresh.size()) + " طلبات توفّر جديدة");
                          post(c, nm, 3000 + (type.hashCode() & 0x1ff), "orders".equals(type) ? CH_ORDERS : CH_MSGS, t, "دوس عشان تشوفهم.", admfOf(type));
                          continue;
                      }
                      for (JSONObject it : fresh) postFeedItem(c, nm, type, it);
                  }
                  sp.edit().putString("feed_seen", nowSeen.toString()).putBoolean("feed_baseline", true).apply();
              }

              private static String admfOf(String type) {
                  if ("customers".equals(type)) return "customers";
                  return "orders".equals(type) ? "orders" : ("inquiries".equals(type) ? "inquiries" : "stock");
              }

              private static String money(double v) {
                  return (v == Math.floor(v) ? String.valueOf((long) v) : String.valueOf(v)) + " ج.م";
              }

              private static void postFeedItem(Context c, NotificationManager nm, String type, JSONObject it) {
                  String id = it.optString("id", "");
                  int nid = 4000 + (id.hashCode() & 0x3fff);
                  String name = it.optString("name", "").trim();
                  if ("orders".equals(type)) {
                      int qty = it.optInt("qty", 0);
                      post(c, nm, nid, CH_ORDERS, "🧾 طلب جديد" + (name.isEmpty() ? "" : " من " + name),
                          "الإجمالي " + money(it.optDouble("total", 0)) + (qty > 0 ? " · " + num(qty) + (qty == 1 ? " قطعة" : " قطع") : ""), "orders");
                  } else if ("customers".equals(type)) {
                      String gov = it.optString("governorate", "").trim();
                      post(c, nm, nid, CH_MSGS, "👤 عميل جديد سجّل" + (name.isEmpty() ? "" : ": " + name),
                          (gov.isEmpty() ? "" : "من " + gov + " - ") + "دوس عشان تشوف بيانات العملاء.", "customers");
                  } else if ("inquiries".equals(type)) {
                      post(c, nm, nid, CH_MSGS, "📨 استفسار جديد" + (name.isEmpty() ? "" : " من " + name),
                          it.optString("message", ""), "inquiries");
                  } else {
                      String variant = "";
                      if (!it.isNull("colorName") && !it.optString("colorName", "").isEmpty()) variant += " (" + it.optString("colorName") + ")";
                      if (!it.isNull("sizeLabel") && !it.optString("sizeLabel", "").isEmpty()) variant += " (" + it.optString("sizeLabel") + ")";
                      post(c, nm, nid, CH_MSGS, "🔔 طلب توفّر: " + it.optString("productName", "") + variant,
                          (name.isEmpty() ? "عميل" : name) + " مستني المنتج يرجع - كلّمه أول ما تزوّد الكمية.", "stock");
                  }
              }

              private static void ensureChannels(NotificationManager nm) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  if (nm.getNotificationChannel(CH_OUT) == null) {
                      NotificationChannel a = new NotificationChannel(CH_OUT, "منتجات خلصت من المخزن", NotificationManager.IMPORTANCE_HIGH);
                      a.setDescription("إشعار لكل منتج كميته خلصت");
                      nm.createNotificationChannel(a);
                  }
                  if (nm.getNotificationChannel(CH_ORDERS) == null) {
                      NotificationChannel o = new NotificationChannel(CH_ORDERS, "طلبات جديدة", NotificationManager.IMPORTANCE_HIGH);
                      o.setDescription("إشعار لكل طلب جديد من العملاء");
                      nm.createNotificationChannel(o);
                  }
                  if (nm.getNotificationChannel(CH_MSGS) == null) {
                      NotificationChannel m = new NotificationChannel(CH_MSGS, "استفسارات وطلبات توفّر وعملاء جداد", NotificationManager.IMPORTANCE_DEFAULT);
                      m.setDescription("إشعار لما عميل يبعت استفسار، أو يطلب يتبلّغ لما منتج يرجع، أو يسجّل حساب جديد");
                      nm.createNotificationChannel(m);
                  }
                  if (nm.getNotificationChannel(CH_LOW) == null) {
                      NotificationChannel b = new NotificationChannel(CH_LOW, "منتجات قربت تخلص", NotificationManager.IMPORTANCE_DEFAULT);
                      b.setDescription("إشعار لما منتج يوصل لحد التنبيه بتاعه");
                      nm.createNotificationChannel(b);
                  }
              }

              @SuppressWarnings("deprecation")
              private static Notification.Builder builder(Context c, String ch) {
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, ch) : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.ic_stat_notify).setColor(0xFFE4002B)
                      .setLargeIcon(android.graphics.BitmapFactory.decodeResource(c.getResources(), R.drawable.notif_logo));
                  if (Build.VERSION.SDK_INT < 26) b.setPriority((CH_OUT.equals(ch) || CH_ORDERS.equals(ch)) ? Notification.PRIORITY_HIGH : Notification.PRIORITY_DEFAULT);
                  return b;
              }

              private static PendingIntent open(Context c, String filter, int req) {
                  Intent i = new Intent(c, MainActivity.class);
                  i.putExtra("admf", filter);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(c, req, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static void post(Context c, NotificationManager nm, int id, String ch, String title, String text, String filter) {
                  boolean stockGroup = CH_OUT.equals(ch) || CH_LOW.equals(ch);
                  Notification.Builder b = builder(c, ch)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(new Notification.BigTextStyle().bigText(text))
                      .setAutoCancel(true)
                      .setContentIntent(open(c, filter, id));
                  if (Build.VERSION.SDK_INT >= 24 && stockGroup) b.setGroup(GROUP);
                  try { nm.notify(id, b.build()); } catch (SecurityException e) { /* not allowed */ }
              }
          }
          EOF


      - name: Generate admin icons (store icon + gear badge)
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          import os, math
          from PIL import Image, ImageDraw
          NAVY=(31,42,68,255); GOLD=(255,196,61,255)
          def gear(size, cx, cy, r, color, hole_color):
              # returns list of drawing ops on an RGBA layer (supersampled)
              S=4; L=Image.new("RGBA",(size*S,size*S),(0,0,0,0)); d=ImageDraw.Draw(L)
              cx,cy,r=cx*S,cy*S,r*S
              teeth=8; ro=r; ri=r*0.78; pts=[]
              for i in range(teeth*4):
                  a=2*math.pi*i/(teeth*4) - math.pi/2
                  rr = ro if (i%4 in (0,1)) else ri
                  pts.append((cx+rr*math.cos(a), cy+rr*math.sin(a)))
              d.polygon(pts, fill=color)
              d.ellipse([cx-ri*0.98,cy-ri*0.98,cx+ri*0.98,cy+ri*0.98], fill=color)
              h=r*0.34; d.ellipse([cx-h,cy-h,cx+h,cy+h], fill=hole_color)
              return L.resize((size,size), Image.LANCZOS)
          def badge(img, cxf, cyf, rf):
              n=img.size[0]; S=4
              L=Image.new("RGBA",(n*S,n*S),(0,0,0,0)); d=ImageDraw.Draw(L)
              cx,cy,r=cxf*n*S,cyf*n*S,rf*n*S
              d.ellipse([cx-r-6*S*n/512,cy-r-6*S*n/512,cx+r+6*S*n/512,cy+r+6*S*n/512], fill=(255,255,255,255))
              d.ellipse([cx-r,cy-r,cx+r,cy+r], fill=NAVY)
              L=L.resize((n,n), Image.LANCZOS)
              out=Image.alpha_composite(img, L)
              g=gear(n, cxf*n, cyf*n, rf*n*0.62, GOLD, NAVY)
              return Image.alpha_composite(out, g)
          def make(src_legacy, src_mask):
              legacy=badge(Image.open(src_legacy).convert("RGBA").resize((512,512)), 0.76, 0.76, 0.2)
              # maskable: safe zone is the central 66%, keep badge inside it
              mask=badge(Image.open(src_mask).convert("RGBA").resize((512,512)), 0.66, 0.66, 0.13)
              return legacy, mask
          if True:
              res=os.path.join(os.environ["P"],"app/src/main/res")
              # admin icon: the store logo on navy + gold ring + gear (admin-icon-*.png in the repo),
              # so it never looks like the customer app on the phone
              def find_icon(fn):
                  for d in ("", ".github/workflows/", ".github/"):
                      if os.path.exists(d+fn): return d+fn
                  return None
              a_leg = find_icon("admin-logo-icon-512.png") or find_icon("admin-icon-512.png")
              a_mask = find_icon("admin-logo-icon-maskable-512.png") or find_icon("admin-icon-maskable-512.png")
              print("admin icons:", a_leg, a_mask)
              if a_leg and a_mask:
                  legacy = Image.open(a_leg).convert("RGBA").resize((512,512), Image.LANCZOS)
                  mask = Image.open(a_mask).convert("RGBA").resize((512,512), Image.LANCZOS)
              else:
                  legacy, mask = make("icon-512.png","icon-maskable-512.png")
              dens={"mdpi":1,"hdpi":1.5,"xhdpi":2,"xxhdpi":3,"xxxhdpi":4}
              for name,f in dens.items():
                  dd=os.path.join(res,"mipmap-"+name); os.makedirs(dd,exist_ok=True)
                  legacy.resize((round(48*f),)*2, Image.LANCZOS).save(os.path.join(dd,"ic_launcher.png"))
                  mask.resize((round(108*f),)*2, Image.LANCZOS).save(os.path.join(dd,"ic_launcher_foreground.png"))
              os.makedirs(os.path.join(res,"drawable-xxxhdpi"), exist_ok=True)
              legacy.resize((480,480), Image.LANCZOS).save(os.path.join(res,"drawable-xxxhdpi","splash_logo.png"))
              # intro logo: round store logo on a white disc + the admin gear badge (motion splash)
              lg = Image.open("logo.png").convert("RGBA")
              bb = lg.getchannel("A").point(lambda v: 255 if v > 20 else 0).getbbox()
              if bb: lg = lg.crop(bb)
              S = 528
              disc = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              m = Image.new("L", (S * 4, S * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, S * 4 - 1, S * 4 - 1), fill=255)
              disc.paste(Image.new("RGBA", (S, S), (255, 255, 255, 255)), (0, 0), m.resize((S, S), Image.LANCZOS))
              r = int(S * 0.92) / max(lg.size)
              l2 = lg.resize((round(lg.width * r), round(lg.height * r)), Image.LANCZOS)
              disc.alpha_composite(l2, ((S - l2.width) // 2, (S - l2.height) // 2))
              badge(disc, 0.83, 0.83, 0.13).save(os.path.join(res, "drawable-xxxhdpi", "intro_logo.png"))
              print("intro logo ok")
              import base64, io
              # notification icons: small (round store badge: ring + bag with the letters, white) + large (the store logo in color)
              ICON_B64 = ""
              small = Image.open(io.BytesIO(base64.b64decode(ICON_B64))).convert("RGBA")
              for dn, px in {"mdpi":24, "hdpi":36, "xhdpi":48, "xxhdpi":72, "xxxhdpi":96}.items():
                  dd = os.path.join(res, "drawable-" + dn); os.makedirs(dd, exist_ok=True)
                  small.resize((px, px), Image.LANCZOS).save(os.path.join(dd, "ic_stat_notify.png"))
              nd = os.path.join(res, "drawable-nodpi"); os.makedirs(nd, exist_ok=True)
              legacy.resize((256, 256), Image.LANCZOS).save(os.path.join(nd, "notif_logo.png"))
              print("notification icons ok")
              print("icons ok")
          EOF

      - name: Build APK (unsigned)
        run: |
          set -o pipefail
          cd "$P"
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Align APK and publish to branch admin-apk-build
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools $BT"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$P/app/build/outputs/apk/release/app-release-unsigned.apk" "$OUT/alabdo-admin-unsigned.apk"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c -p 4 "$OUT/alabdo-admin-unsigned.apk"
          cp "$ANDROID_HOME/build-tools/$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          echo "ok run ${{ github.run_number }} build-tools $BT $(date -u)" > "$OUT/info.txt"
          tail -n 60 "$RUNNER_TEMP/build.log" > "$OUT/build.log"
          cd "$OUT"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Admin APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/admin-apk-build

      - name: Save build log on failure (branch admin-apk-build)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logrepo" && cd "$RUNNER_TEMP/logrepo"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$RUNNER_TEMP/build.log" ]; then tail -n 400 "$RUNNER_TEMP/build.log" > build.log; else echo "failed before the Gradle build step" > build.log; fi
          echo "FAILED run ${{ github.run_number }} at $(date -u)" > info.txt
          git add . && git commit -q -m "build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/admin-apk-build
