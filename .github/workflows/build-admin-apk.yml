          package com.alabdotoys.admin;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.PowerManager;

          /* منبّه كل دقيقتين تقريبًا: بيصحّي الموبايل لحظات، يشيك على الجديد، ويطلع
             الإشعارات، وبعدين يرجع ينام. (لو الموبايل في وضع توفير الطاقة العميق،
             أندرويد بيسمح بيه كل 9-15 دقيقة بس.) */
          public class WatchTick extends BroadcastReceiver {
              static final String ACTION = "com.alabdotoys.admin.WATCH_TICK";
              static final long EVERY = 60L * 1000L;

              static void scheduleNext(Context c, long delayMs) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  Intent i = new Intent(c, WatchTick.class).setAction(ACTION);
                  PendingIntent pi = PendingIntent.getBroadcast(c, 9, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  long at = System.currentTimeMillis() + delayMs;
                  /* منبّه "بالظبط" كل دقيقة (حتى والموبايل مقفول الشاشة). لو أندرويد
                     مش سامح بالمنبّه الدقيق نستخدم العادي. */
                  boolean exact = Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms();
                  try {
                      if (Build.VERSION.SDK_INT >= 23) {
                          if (exact) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                          else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                      } else {
                          am.setExact(AlarmManager.RTC_WAKEUP, at, pi);
                      }
                  } catch (SecurityException e) {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                  }
              }

              @Override
              public void onReceive(final Context ctx, Intent intent) {
                  final Context c = ctx.getApplicationContext();
                  final PendingResult pr = goAsync();
                  PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                  final PowerManager.WakeLock wl = pm != null ? pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "alabdo:watch") : null;
                  if (wl != null) wl.acquire(50000L);
                  new Thread(new Runnable() {
                      @Override public void run() {
                          try { StockWatchJob.runAll(c); }
                          catch (Throwable t) { /* ignore */ }
                          finally {
                              scheduleNext(c, EVERY);
                              try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) { /* ignore */ }
                              pr.finish();
                          }
                      }
                  }).start();
              }
          }
