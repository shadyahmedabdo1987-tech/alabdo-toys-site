# رصيد — تجهيز صفحة الآب ستور (وصف/صور/سعر/تقييم عمري) والإرسال للمراجعة. (run 2)
name: Raseed App Store submit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/raseed-submit.yml"]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and submit
        env:
          K1: ${{ secrets.ASC_KEY_ID }}
          K2: ${{ secrets.ASC_ISSUER_ID }}
          K3: ${{ secrets.ASC_KEY_P8 }}
          DO_SUBMIT: "1"
        run: |
          pip3 install --quiet pyjwt cryptography
          printf '%s\n' "$K3" > "$RUNNER_TEMP/k.p8"
          python3 .github/raseed-store/submit.py 2>&1 | tee "$RUNNER_TEMP/report.txt"
          rm -f "$RUNNER_TEMP/k.p8"

      - name: Save report (branch raseed-submit-report)
        if: always()
        run: |
          mkdir -p r && cd r && git init -q
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/report.txt" report.txt 2>/dev/null || echo "no report" > report.txt
          git add . && git commit -q -m "report $(date -u)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/raseed-submit-report
