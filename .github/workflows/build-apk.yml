                  con.setConnectTimeout(15000);
                  con.setReadTimeout(15000);
                  con.setRequestProperty("Accept", "application/json");
                  con.setRequestProperty("User-Agent", "AlAbdoApp/5 notes");
                  con.setRequestProperty("X-Customer-Id", cid);
