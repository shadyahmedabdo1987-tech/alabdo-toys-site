# رصيد - نسخة آيفون (App Store / TestFlight)
# الكود بتاع التطبيق في الريبو shadyahmedabdo1987-tech/raseed-ios
# والوركفلو هنا عشان يستخدم نفس أسرار أبل المتسجلة في الريبو ده
# (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8) — مبيتكتبوش هنا أبدًا.
# رقم البناء بيزيد لوحده مع كل تشغيل. (run 202610250318)

name: Build Raseed iOS (TestFlight)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-raseed-ios.yml"

permissions:
  contents: write

concurrency:
  group: build-raseed-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    env:
      RUN: ${{ github.run_number }}
      APP_VERSION: "1.9.3"
      BUNDLE_ID: com.shadyahmed.raseed
    steps:
      - name: Checkout (secrets repo)
        uses: actions/checkout@v4

      - name: Checkout Raseed source
        uses: actions/checkout@v4
        with:
          repository: shadyahmedabdo1987-tech/raseed-ios
          path: raseed

      - name: Check the Apple secrets
        env:
          K1: ${{ secrets.ASC_KEY_ID }}
          K2: ${{ secrets.ASC_ISSUER_ID }}
          K3: ${{ secrets.ASC_KEY_P8 }}
        run: |
          miss=""
          [ -n "$K1" ] || miss="$miss ASC_KEY_ID"
          [ -n "$K2" ] || miss="$miss ASC_ISSUER_ID"
          [ -n "$K3" ] || miss="$miss ASC_KEY_P8"
          if [ -n "$miss" ]; then echo "missing secrets:$miss" | tee "$RUNNER_TEMP/build.log"; exit 1; fi
          T="8G52ACR278"
          I=$(printf '%s' "$K1" | tr -cd 'A-Za-z0-9')
          S=$(printf '%s' "$K2" | tr -cd 'A-Za-z0-9-')
          echo "TEAM_ID=$T" >> "$GITHUB_ENV"
          echo "ASC_KID=$I" >> "$GITHUB_ENV"
          echo "ASC_ISS=$S" >> "$GITHUB_ENV"
          echo "secrets ok" | tee "$RUNNER_TEMP/build.log"

      - name: Newest Xcode + XcodeGen
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
          brew install xcodegen

      - name: App Store Connect key (temporary file)
        env:
          K3: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KID}.p8"
          printf '%s\n' "$K3" > "$KEY"
          chmod 600 "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" && grep -q "END PRIVATE KEY" "$KEY" || { echo "ASC_KEY_P8 BEGIN/END lines missing" | tee -a "$RUNNER_TEMP/build.log"; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Register bundle ID + check App Store Connect app record
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          python3 - <<'PY'
          import jwt, time, json, os, urllib.request, urllib.error
          key = open(os.environ['ASC_KEY_PATH']).read()
          now = int(time.time())
          tok = jwt.encode({'iss': os.environ['ASC_ISS'], 'iat': now, 'exp': now + 900, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': os.environ['ASC_KID'], 'typ': 'JWT'})
          def api(method, path, body=None):
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, method=method,
                    data=json.dumps(body).encode() if body else None,
                    headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req) as r: return r.status, json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e: return e.code, json.loads(e.read() or b'{}')
          log = open(os.environ['RUNNER_TEMP'] + '/build.log', 'a')
          bid = os.environ['BUNDLE_ID']
          s, d = api('GET', '/v1/bundleIds?filter[identifier]=' + bid)
          if not [x for x in d.get('data', []) if x['attributes']['identifier'] == bid]:
              s, d = api('POST', '/v1/bundleIds', {'data': {'type': 'bundleIds', 'attributes': {'identifier': bid, 'name': 'Raseed', 'platform': 'IOS'}}})
              print('BUNDLE_ID_REGISTERED', s, json.dumps(d.get('errors', ''))[:300]); log.write('BUNDLE_ID_REGISTERED %s\n' % s)
          else:
              print('BUNDLE_ID_EXISTS'); log.write('BUNDLE_ID_EXISTS\n')
          s, d = api('GET', '/v1/apps?filter[bundleId]=' + bid)
          apps = d.get('data', [])
          if not apps:
              m = 'NO_APP_RECORD error: create the app in App Store Connect (Apps > + > New App) with bundle ID ' + bid
              print(m); log.write(m + '\n'); raise SystemExit(1)
          print('APP_RECORD', apps[0]['id'], apps[0]['attributes']['name']); log.write('APP_RECORD %s %s\n' % (apps[0]['id'], apps[0]['attributes']['name']))
          PY

      - name: Create the Xcode project
        run: |
          set -e
          P="$RUNNER_TEMP/ios"
          echo "P=$P" >> "$GITHUB_ENV"
          R="$GITHUB_WORKSPACE/raseed/native-ios"
          mkdir -p "$P/Sources"
          cp "$R"/Sources/*.swift "$P/Sources/"
          cp -R "$R/web" "$P/web"
          A="$P/Sources/Assets.xcassets"
          mkdir -p "$A/AppIcon.appiconset" "$A/LaunchBg.colorset" "$A/LaunchLogo.imageset"
          cp "$R/assets/icon-1024.png" "$A/AppIcon.appiconset/icon-1024.png"
          cp "$R/assets/launch-logo@1x.png" "$A/LaunchLogo.imageset/logo.png"
          cp "$R/assets/launch-logo.png" "$A/LaunchLogo.imageset/logo@2x.png"
          cat > "$A/Contents.json" <<'EOF'
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat > "$A/AppIcon.appiconset/Contents.json" <<'EOF'
          { "images" : [ { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" } ],
            "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat > "$A/LaunchBg.colorset/Contents.json" <<'EOF'
          { "colors" : [ { "idiom" : "universal", "color" : { "color-space" : "srgb", "components" : { "red" : "0.027", "green" : "0.043", "blue" : "0.243", "alpha" : "1.000" } } } ],
            "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat > "$A/LaunchLogo.imageset/Contents.json" <<'EOF'
          { "images" : [ { "filename" : "logo.png", "idiom" : "universal", "scale" : "1x" },
                         { "filename" : "logo@2x.png", "idiom" : "universal", "scale" : "2x" },
                         { "idiom" : "universal", "scale" : "3x" } ],
            "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat > "$P/Sources/PrivacyInfo.xcprivacy" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>NSPrivacyTracking</key><false/>
            <key>NSPrivacyTrackingDomains</key><array/>
            <key>NSPrivacyCollectedDataTypes</key><array/>
            <key>NSPrivacyAccessedAPITypes</key>
            <array>
              <dict>
                <key>NSPrivacyAccessedAPIType</key><string>NSPrivacyAccessedAPICategoryFileTimestamp</string>
                <key>NSPrivacyAccessedAPITypeReasons</key><array><string>C617.1</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          cat > "$P/project.yml" <<EOF
          name: Raseed
          options:
            bundleIdPrefix: com.shadyahmed
            deploymentTarget:
              iOS: "15.0"
          targets:
            Raseed:
              type: application
              platform: iOS
              sources:
                - path: Sources
                - path: web
                  type: folder
              scheme: {}
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: "رصيد"
                  CFBundleDevelopmentRegion: ar
                  CFBundleShortVersionString: "${APP_VERSION}"
                  CFBundleVersion: "${RUN}"
                  UILaunchScreen:
                    UIColorName: LaunchBg
                    UIImageName: LaunchLogo
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
                  UIStatusBarStyle: UIStatusBarStyleLightContent
                  UIViewControllerBasedStatusBarAppearance: true
                  UIRequiresFullScreen: true
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  NSFaceIDUsageDescription: "رصيد بيستخدم بصمة الوش علشان يفتح التطبيق ليك إنت بس ويحمي بياناتك المالية."
                  ITSAppUsesNonExemptEncryption: false
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
                  TARGETED_DEVICE_FAMILY: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  SWIFT_VERSION: "5.0"
                  CODE_SIGN_STYLE: Automatic
                  DEVELOPMENT_TEAM: ${TEAM_ID}
          EOF
          ls -R "$P" | head -40

      - name: Archive (unsigned - signing happens on upload)
        run: |
          set -e
          set -o pipefail
          cd "$P"
          xcodegen generate
          xcodebuild -project Raseed.xcodeproj -scheme Raseed -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$P/build/Raseed.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive 2>&1 | tee -a "$RUNNER_TEMP/build.log" | tail -n 40

      - name: Upload to App Store Connect (TestFlight)
        run: |
          set -e
          set -o pipefail
          cat > "$P/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$P/build/Raseed.xcarchive" \
            -exportOptionsPlist "$P/ExportOptions.plist" -exportPath "$P/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KID" -authenticationKeyIssuerID "$ASC_ISS" \
            2>&1 | tee -a "$RUNNER_TEMP/build.log" | tail -n 40

      - name: Report (branch raseed-ios-build)
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH"
          mkdir -p "$RUNNER_TEMP/rep" && cd "$RUNNER_TEMP/rep"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ job.status }}" = "success" ]; then
            echo "ok run ${RUN} Raseed ${APP_VERSION} (${RUN}) uploaded to App Store Connect $(xcodebuild -version | head -1) $(date -u)" > info.txt
          else
            echo "FAILED run ${RUN} at $(date -u)" > info.txt
          fi
          if [ -f "$RUNNER_TEMP/build.log" ]; then grep -E "error:|error |ERROR|BUILD|EXPORT|Upload|upload" "$RUNNER_TEMP/build.log" | grep -v -i "authenticationKey" | head -n 150 > errors.txt || true; tail -n 300 "$RUNNER_TEMP/build.log" | grep -v -i "BEGIN PRIVATE KEY" > build.log; fi
          git add . && git commit -q -m "Raseed iOS build ${RUN}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/raseed-ios-build
