          cat > $P/app/src/main/java/com/alabdotoys/app/CartReminderJob.java <<'EOF'
          package com.alabdotoys.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.job.JobInfo;
          import android.app.job.JobParameters;
          import android.app.job.JobScheduler;
          import android.app.job.JobService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          /* تذكير السلة: لو العميل قفل التطبيق وفي منتجات في السلة، بيطلعله إشعار بعد
             ساعة، وتاني بعد يوم، يفكّره يكمّل الطلب أو يمسح السلة. أول ما يفتح
             التطبيق أو السلة تفضى، التذكيرات دي بتتلغي. */
          public class CartReminderJob extends JobService {
              static final String PREFS = "alabdo_cart";
              static final int JOB_1H = 101, JOB_24H = 102;
              static final int NOTIF_ID = 501;
              static final String CHANNEL = "cart_reminder";

              static void saveCart(Context c, int count, String names) {
                  c.getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                      .putInt("count", Math.max(0, count))
                      .putString("names", names == null ? "" : names)
                      .apply();
                  if (count <= 0) cancelAll(c);
              }

              static int cartCount(Context c) {
                  return c.getSharedPreferences(PREFS, MODE_PRIVATE).getInt("count", 0);
              }

              /* التطبيق اتقفل (راح في الخلفية) والسلة فيها منتجات */
              static void scheduleReminders(Context c) {
                  if (cartCount(c) <= 0) return;
                  JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                  if (js == null) return;
                  ComponentName cn = new ComponentName(c, CartReminderJob.class);
                  long hour = 60L * 60L * 1000L;
                  js.schedule(new JobInfo.Builder(JOB_1H, cn).setMinimumLatency(hour).setOverrideDeadline(hour + 20L * 60L * 1000L).build());
                  js.schedule(new JobInfo.Builder(JOB_24H, cn).setMinimumLatency(24L * hour).setOverrideDeadline(25L * hour).build());
              }

              /* العميل فتح التطبيق، أو السلة فضيت */
              static void cancelAll(Context c) {
                  JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                  if (js != null) { js.cancel(JOB_1H); js.cancel(JOB_24H); }
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.cancel(NOTIF_ID);
              }

              @Override
              public boolean onStartJob(JobParameters params) {
                  try {
                      if (!MainActivity.foreground) showReminder(this);
                  } catch (Exception e) { /* ignore */ }
                  return false;
              }

              @Override
              public boolean onStopJob(JobParameters params) { return false; }

              private static PendingIntent open(Context c, String what, int req) {
                  Intent i = new Intent(c, MainActivity.class);
                  i.putExtra("aa_open", what);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getActivity(c, req, i, flags);
              }

              @SuppressWarnings("deprecation")
              static void showReminder(Context c) {
                  SharedPreferences sp = c.getSharedPreferences(PREFS, MODE_PRIVATE);
                  int count = sp.getInt("count", 0);
                  if (count <= 0) return;
                  String names = sp.getString("names", "");
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(CHANNEL) == null) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "تذكير السلة", NotificationManager.IMPORTANCE_DEFAULT);
                      ch.setDescription("بيفكّرك لو سايب منتجات في السلة من غير ما تكمّل الطلب");
                      nm.createNotificationChannel(ch);
                  }
                  String title = "🛒 سلتك مستنياك في متجر آل عبده";
                  String text = "عندك " + count + (count == 1 ? " قطعة" : (count <= 10 ? " قطع" : " قطعة")) + " في السلة"
                      + (names.isEmpty() ? "" : ": " + names)
                      + ". كمّل طلبك قبل ما الكميات تخلص، أو امسح السلة لو غيّرت رأيك.";
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, CHANNEL) : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.ic_stat_notify)
                      .setColor(0xFFEE1F6C)
                      .setLargeIcon(android.graphics.BitmapFactory.decodeResource(c.getResources(), R.drawable.notif_logo))
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(new Notification.BigTextStyle().bigText(text))
                      .setAutoCancel(true)
                      .setContentIntent(open(c, "cart", 1))
                      .addAction(new Notification.Action.Builder(null, "كمّل الطلب", open(c, "cart", 2)).build())
                      .addAction(new Notification.Action.Builder(null, "امسح السلة", open(c, "clearcart", 3)).build());
                  if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_DEFAULT);
                  try { nm.notify(NOTIF_ID, b.build()); } catch (SecurityException e) { /* notifications not allowed */ }
              }
          }
