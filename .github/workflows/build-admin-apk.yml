# آل عبده - الإدارة: بناء تطبيق لوحة التحكم أوتوماتيك على سيرفرات GitHub.
# icons: admin = round store logo, transparent background + small gold gear (admin-logo-icon-*.png)
# print: AlAbdoNative.printPdf (sales report)
# notifications: red accent + round store-badge status-bar icon (same as the customer app)
# التطبيق بيفتح لوحة تحكم المتجر جوه متصفح داخلي خاص بيه (WebView) - من غير
# جوجل كروم خالص، فمفيش أي رسالة من كروم أول مرة. تطبيق منفصل عن تطبيق
# العملاء (com.alabdotoys.admin)، أيقونته عليها ترس، ولموبايلك إنت بس
# (مش بيترفع على جوجل بلاي).
# بيبني ملف APK من غير توقيع ويحطه في فرع admin-apk-build - التوقيع بيحصل
# برّه بمفتاح المتجر عشان المفتاح ميترفعش على الإنترنت أبدًا.
# وتقدر تشغّله تاني يدوي من Actions ← Build Admin APK ← Run workflow.

name: Build Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-admin-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-admin-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Python (for icons)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Android project
        run: |
          set -e
          P="$RUNNER_TEMP/android-admin"
          echo "P=$P" >> "$GITHUB_ENV"
          mkdir -p $P/app/src/main/java/com/alabdotoys/admin $P/app/src/main/res/values $P/app/src/main/res/values-v31 $P/app/src/main/res/xml $P/app/src/main/res/drawable $P/app/src/main/res/drawable-xxxhdpi $P/app/src/main/res/mipmap-anydpi-v26

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AlAbdoAdmin"
          include ":app"
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.alabdotoys.admin'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.alabdotoys.admin'
                  minSdk 23
                  targetSdk 36
                  versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
                  versionName '2.0.' + (System.getenv('APP_VERSION_CODE') ?: '1')
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:enableOnBackInvokedCallback="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".WatchService"
                      android:foregroundServiceType="specialUse"
                      android:exported="false">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Store owner app: alerts the owner about new customer orders, messages and stock running out while the app is closed" />
                  </service>

                  <receiver
                      android:name=".WatchTick"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".StockWatchJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">آل عبده - الإدارة</string>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="brandPink">#1B2440</color>
              <color name="splashBg">#1B2440</color>
              <color name="iconBackground">#00000000</color>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash_bg</item>
                  <item name="android:statusBarColor">@color/brandPink</item>
                  <item name="android:colorPrimary">@color/brandPink</item>
                  <item name="android:colorAccent">@color/brandPink</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/values-v31/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/splashBg</item>
                  <item name="android:statusBarColor">@color/brandPink</item>
                  <item name="android:colorPrimary">@color/brandPink</item>
                  <item name="android:colorAccent">@color/brandPink</item>
                  <item name="android:windowSplashScreenBackground">@color/splashBg</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/drawable/splash_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/splashBg" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/splash_logo" />
              </item>
          </layer-list>
          EOF

          cat > $P/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="camera" path="camera/" />
              <cache-path name="exports" path="exports/" />
          </paths>
          EOF

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/iconBackground" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > $P/app/src/main/java/com/alabdotoys/admin/MainActivity.java <<'EOF'
          package com.alabdotoys.admin;

          import android.animation.ObjectAnimator;
          import android.animation.ValueAnimator;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Insets;
          import android.net.Uri;
          import android.os.Build;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.animation.LinearInterpolator;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.window.OnBackInvokedDispatcher;

          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.util.ArrayList;

          /* آل عبده - الإدارة: لوحة تحكم المتجر جوه متصفح داخلي خاص بيها (WebView)
             من غير جوجل كروم خالص، فمفيش أي رسالة من كروم بتظهر أول مرة.
             - زرار "نسخة احتياطية" بيحفظ الملف في فولدر Downloads على الموبايل
               (عن طريق AlAbdoNative.saveFile).
             - لينكات الموقع بتفتح جوه التطبيق، وأي لينك برّه (واتساب، تليفون،
               فيسبوك...) بيفتح في التطبيق المناسب على الموبايل.
             - رفع الصور (زي سكرين شوت التحويل) من المعرض أو الكاميرا.
             - زرار الرجوع بيرجع خطوة جوه الموقع قبل ما يقفل التطبيق. */
          public class MainActivity extends Activity {
              private static final String HOST = "alabdo-toys.com";
              private static final String HOME = "https://alabdo-toys.com/?source=admin#ld2Hmke8ryGU7G5QRI56vgwE58fe";
              private static final int REQ_FILE = 1001;

              private WebView web;
              private View topBar, bottomBar, splash;
              private ValueCallback<Uri[]> fileCallback;
              private Uri cameraUri;
              private boolean splashHidden = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  boolean night = (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
                  int bottomColor = night ? 0xFF181E33 : 0xFFFFFFFF;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF1B2440);
                  topBar = new View(this);
                  topBar.setBackgroundColor(night ? 0xFF121829 : 0xFF1B2440);
                  bottomBar = new View(this);
                  bottomBar.setBackgroundColor(bottomColor);
                  FrameLayout content = new FrameLayout(this);
                  web = new WebView(this);
                  web.setBackgroundColor(night ? 0xFF0E1220 : 0xFFF3F4F9);
                  content.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  splash = buildSplash();
                  content.addView(splash, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  root.addView(topBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0));
                  root.addView(content, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  root.addView(bottomBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0));
                  setContentView(root);

                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                      root.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                          @Override
                          public WindowInsets onApplyWindowInsets(View v, WindowInsets insets) {
                              Insets sys = insets.getInsets(WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout());
                              Insets ime = insets.getInsets(WindowInsets.Type.ime());
                              setHeight(topBar, sys.top);
                              setHeight(bottomBar, Math.max(sys.bottom, ime.bottom));
                              v.setPadding(sys.left, 0, sys.right, 0);
                              return WindowInsets.CONSUMED;
                          }
                      });
                      WindowInsetsController c = w.getInsetsController();
                      if (c != null) {
                          int mask = WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS | WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS;
                          c.setSystemBarsAppearance(night ? 0 : WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS, mask);
                      }
                  } else {
                      w.setStatusBarColor(night ? 0xFF121829 : 0xFF1B2440);
                      if (Build.VERSION.SDK_INT >= 26) {
                          w.setNavigationBarColor(bottomColor);
                          if (!night) w.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
                      } else {
                          w.setNavigationBarColor(Color.BLACK);
                      }
                  }

                  setupWebView();

                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(OnBackInvokedDispatcher.PRIORITY_DEFAULT, new android.window.OnBackInvokedCallback() {
                          @Override
                          public void onBackInvoked() { goBackOrClose(); }
                      });
                  }

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(startUrl(getIntent()));
                  }
                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override public void run() { hideSplash(); }
                  }, 15000);
              }

              /* شاشة الافتتاح (موشن) لتطبيق الإدارة: خلفية كحلي متدرجة، اللوجو
                 (بشارة الترس) بيظهر بنطّة ويلف لفة 3D، حواليه قوس تحميل بيلف
                 بتدرج أزرق ووردي، وحلقة منقطة بنقط مضيئة بتلف عكسه، وموجة
                 بتنبض. تحته "آل عبده" و"لوحة الإدارة" وشريط تحميل. بتفضل لحد
                 ما البيانات تحمل (appReady) - مش أقل من مدة الحركة الأساسية -
                 وبحد أقصى 15 ثانية. */
              private static final long SPLASH_MIN_MS = 1800;
              private long splashStart = 0;
              private View splashLogo;
              private final ArrayList<android.animation.Animator> splashAnims = new ArrayList<>();

              private android.graphics.drawable.GradientDrawable oval(int fill, int strokeColor, int strokeW) {
                  android.graphics.drawable.GradientDrawable g = new android.graphics.drawable.GradientDrawable();
                  g.setShape(android.graphics.drawable.GradientDrawable.OVAL);
                  g.setColor(fill);
                  if (strokeW > 0) g.setStroke(strokeW, strokeColor);
                  return g;
              }
              private void play(android.animation.Animator a) { splashAnims.add(a); a.start(); }
              private boolean animsOn() { return Build.VERSION.SDK_INT < 26 || ValueAnimator.areAnimatorsEnabled(); }
              private ObjectAnimator loop(View v, String prop, float from, float to, long ms, boolean reverse) {
                  ObjectAnimator a = ObjectAnimator.ofFloat(v, prop, from, to);
                  a.setDuration(ms);
                  a.setRepeatCount(ValueAnimator.INFINITE);
                  a.setRepeatMode(reverse ? ValueAnimator.REVERSE : ValueAnimator.RESTART);
                  a.setInterpolator(reverse ? new android.view.animation.AccelerateDecelerateInterpolator() : new LinearInterpolator());
                  return a;
              }

              private View buildSplash() {
                  final float d = getResources().getDisplayMetrics().density;
                  final boolean loops = animsOn();
                  splashStart = android.os.SystemClock.uptimeMillis();

                  FrameLayout f = new FrameLayout(this);
                  android.graphics.drawable.GradientDrawable bg = new android.graphics.drawable.GradientDrawable(
                      android.graphics.drawable.GradientDrawable.Orientation.TOP_BOTTOM,
                      new int[]{0xFF22305A, 0xFF161E38, 0xFF0E1220});
                  f.setBackground(bg);
                  f.setClickable(true);
                  f.setClipChildren(false);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER_HORIZONTAL);
                  col.setClipChildren(false);
                  f.addView(col, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER));

                  final int stage = (int) (280 * d);
                  FrameLayout st = new FrameLayout(this);
                  st.setClipChildren(false);
                  col.addView(st, new LinearLayout.LayoutParams(stage, stage));

                  /* توهج ناعم */
                  View glow = new View(this);
                  android.graphics.drawable.GradientDrawable gd = new android.graphics.drawable.GradientDrawable();
                  gd.setShape(android.graphics.drawable.GradientDrawable.OVAL);
                  gd.setGradientType(android.graphics.drawable.GradientDrawable.RADIAL_GRADIENT);
                  gd.setColors(new int[]{0x4474B9FF, 0x22FF5A9C, 0x000E1220});
                  gd.setGradientRadius(stage / 2f);
                  glow.setBackground(gd);
                  glow.setAlpha(0f);
                  st.addView(glow, new FrameLayout.LayoutParams(stage, stage, Gravity.CENTER));

                  /* حلقة منقطة بنقط مضيئة بتلف ببطء */
                  final int ringSize = (int) (250 * d);
                  View dotted = new View(this) {
                      final android.graphics.Paint p = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
                      { p.setStyle(android.graphics.Paint.Style.STROKE); p.setStrokeWidth(1.6f * d); p.setColor(0x3374B9FF);
                        p.setPathEffect(new android.graphics.DashPathEffect(new float[]{3 * d, 7 * d}, 0)); }
                      @Override protected void onDraw(android.graphics.Canvas c) {
                          float r = getWidth() / 2f - 2 * d;
                          c.drawCircle(getWidth() / 2f, getHeight() / 2f, r, p);
                      }
                  };
                  FrameLayout orbit = new FrameLayout(this);
                  orbit.setClipChildren(false);
                  orbit.addView(dotted, new FrameLayout.LayoutParams(ringSize, ringSize, Gravity.CENTER));
                  int[] dc = {0xFF74B9FF, 0xFFFF5A9C, 0xFFFFCB47, 0xFF5FE0AA, 0xFF74B9FF};
                  for (int i = 0; i < dc.length; i++) {
                      View dot = new View(this);
                      dot.setBackground(oval(dc[i], 0x55FFFFFF, (int) (2 * d)));
                      int s = (int) ((i % 2 == 0 ? 10 : 8) * d);
                      double ang = Math.toRadians(i * 72 - 90);
                      float rr = ringSize / 2f - 2 * d;
                      dot.setTranslationX((float) (Math.cos(ang) * rr));
                      dot.setTranslationY((float) (Math.sin(ang) * rr));
                      dot.setScaleX(0f); dot.setScaleY(0f);
                      orbit.addView(dot, new FrameLayout.LayoutParams(s, s, Gravity.CENTER));
                      ObjectAnimator pin = ObjectAnimator.ofPropertyValuesHolder(dot,
                          android.animation.PropertyValuesHolder.ofFloat("scaleX", 0f, 1f),
                          android.animation.PropertyValuesHolder.ofFloat("scaleY", 0f, 1f));
                      pin.setDuration(420);
                      pin.setStartDelay(500 + i * 90);
                      pin.setInterpolator(new android.view.animation.OvershootInterpolator(2.5f));
                      play(pin);
                  }
                  orbit.setAlpha(0f);
                  st.addView(orbit, new FrameLayout.LayoutParams(stage, stage, Gravity.CENTER));
                  ObjectAnimator orbitIn = ObjectAnimator.ofFloat(orbit, "alpha", 0f, 1f);
                  orbitIn.setDuration(500); orbitIn.setStartDelay(400);
                  play(orbitIn);
                  if (loops) play(loop(orbit, "rotation", 0f, -360f, 16000, false));

                  /* موجة بتنبض من اللوجو */
                  final int logoSize = (int) (132 * d);
                  View ripple = new View(this);
                  ripple.setBackground(oval(0x00000000, 0xFF74B9FF, (int) (2 * d)));
                  ripple.setAlpha(0f);
                  st.addView(ripple, new FrameLayout.LayoutParams(logoSize, logoSize, Gravity.CENTER));
                  ObjectAnimator rp = ObjectAnimator.ofPropertyValuesHolder(ripple,
                      android.animation.PropertyValuesHolder.ofFloat("scaleX", 1f, 1.75f),
                      android.animation.PropertyValuesHolder.ofFloat("scaleY", 1f, 1.75f),
                      android.animation.PropertyValuesHolder.ofFloat("alpha", 0.6f, 0f));
                  rp.setDuration(1600); rp.setStartDelay(450);
                  rp.setInterpolator(new android.view.animation.DecelerateInterpolator());
                  if (loops) rp.setRepeatCount(ValueAnimator.INFINITE);
                  play(rp);

                  /* قوس تحميل بتدرج أزرق ← وردي بيلف حوالين اللوجو */
                  final int arcSize = (int) (172 * d);
                  View arc = new View(this) {
                      final android.graphics.Paint track = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
                      final android.graphics.Paint p = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
                      final android.graphics.RectF box = new android.graphics.RectF();
                      { track.setStyle(android.graphics.Paint.Style.STROKE); track.setStrokeWidth(3 * d); track.setColor(0x1AFFFFFF);
                        p.setStyle(android.graphics.Paint.Style.STROKE); p.setStrokeWidth(4 * d); p.setStrokeCap(android.graphics.Paint.Cap.ROUND); }
                      @Override protected void onSizeChanged(int w, int h, int ow, int oh) {
                          p.setShader(new android.graphics.SweepGradient(w / 2f, h / 2f,
                              new int[]{0x0074B9FF, 0xFF74B9FF, 0xFFFF5A9C, 0xFFFF5A9C}, new float[]{0f, 0.45f, 0.82f, 1f}));
                      }
                      @Override protected void onDraw(android.graphics.Canvas c) {
                          float pad = 3 * d;
                          box.set(pad, pad, getWidth() - pad, getHeight() - pad);
                          c.drawOval(box, track);
                          c.drawArc(box, 0, 300, false, p);
                      }
                  };
                  arc.setAlpha(0f);
