                  PendingIntent pi = PendingIntent.getActivity(c, req, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, personal ? CH_ORDERS : CHANNEL) : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.ic_stat_notify)
                      .setColor(0xFFE4002B)
                      .setLargeIcon(android.graphics.BitmapFactory.decodeResource(c.getResources(), R.drawable.notif_logo))
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new Notification.BigTextStyle().bigText(body))
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                      .addAction(new Notification.Action.Builder(null, personal ? ("orders".equals(link) ? "تابع طلبك" : "افتح") : "شوف العرض", pi).build());
                  if (personal) b.setCategory(Notification.CATEGORY_STATUS);
                  if (Build.VERSION.SDK_INT < 26) { b.setPriority(personal ? Notification.PRIORITY_HIGH : Notification.PRIORITY_DEFAULT); if (personal) b.setDefaults(Notification.DEFAULT_ALL); }
                  try { nm.notify(req, b.build()); } catch (SecurityException e) { /* notifications not allowed */ }
              }
          }
          EOF

          cat > $P/app/src/main/java/com/alabdotoys/app/Push.java <<'EOF'
          package com.alabdotoys.app;

          import android.content.Context;
          import android.content.SharedPreferences;

          import com.google.firebase.FirebaseApp;
          import com.google.firebase.messaging.FirebaseMessaging;

          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          import org.json.JSONObject;

          /* الإشعارات الفورية (Firebase Cloud Messaging): جوجل بتدي الموبايل "عنوان"
             (token)، وإحنا بنسجّله على حساب العميل في السيرفر. لما حالة طلبه تتغير
             السيرفر بيبعت الإشعار للعنوان ده على طول، حتى لو التطبيق مقفول.
             لو ملف إعدادات Firebase مش موجود في البناء، الحاجات دي كلها بتتجاهل
             والتطبيق بيكمّل على الفحص الدوري زي الأول. */
          public class Push {
              static final String API = "https://alabdo-toys.com/api/push-token";

              static boolean ready(Context c) {
                  try { return !FirebaseApp.getApps(c).isEmpty(); } catch (Throwable t) { return false; }
              }

              static void sync(final Context c) {
                  if (!ready(c)) return;
                  final Context app = c.getApplicationContext();
                  try {
                      FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                          if (task.isSuccessful() && task.getResult() != null) register(app, task.getResult(), false);
                      });
                  } catch (Throwable t) { /* ignore */ }
              }

              static void register(final Context c, final String token, boolean force) {
                  SharedPreferences sp = c.getSharedPreferences(OffersJob.PREFS, Context.MODE_PRIVATE);
                  final String cid = sp.getString("cid", ""), cpass = sp.getString("cpass", "");
                  if (cid.length() == 0 || cpass.length() == 0 || token == null || token.length() == 0) return;
                  long last = sp.getLong("push_reg_at", 0L);
                  if (!force && (cid + "|" + token).equals(sp.getString("push_reg", ""))
                          && System.currentTimeMillis() - last < 3L * 24L * 60L * 60L * 1000L) return;
                  new Thread(() -> {
                      if (call("register", cid, cpass, token)) {
                          c.getSharedPreferences(OffersJob.PREFS, Context.MODE_PRIVATE).edit()
                              .putString("push_reg", cid + "|" + token)
                              .putLong("push_reg_at", System.currentTimeMillis()).apply();
                      }
                  }).start();
              }

              static void unregister(final Context c, final String cid, final String cpass) {
                  if (cid == null || cid.length() == 0) return;
                  c.getSharedPreferences(OffersJob.PREFS, Context.MODE_PRIVATE).edit().remove("push_reg").remove("push_reg_at").apply();
                  if (!ready(c)) return;
                  try {
                      FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                          if (task.isSuccessful() && task.getResult() != null) {
                              final String tok = task.getResult();
                              new Thread(() -> call("remove", cid, cpass, tok)).start();
                          }
                      });
                  } catch (Throwable t) { /* ignore */ }
              }

              static boolean call(String action, String cid, String cpass, String token) {
                  HttpURLConnection con = null;
                  try {
                      con = (HttpURLConnection) new URL(API).openConnection();
                      con.setRequestMethod("POST");
                      con.setConnectTimeout(15000);
                      con.setReadTimeout(15000);
                      con.setDoOutput(true);
                      con.setRequestProperty("Content-Type", "application/json");
                      con.setRequestProperty("User-Agent", "AlAbdoApp/5 push");
                      con.setRequestProperty("X-Customer-Id", cid);
                      con.setRequestProperty("X-Customer-Pass", cpass);
                      JSONObject b = new JSONObject();
                      b.put("token", token);
                      b.put("action", action);
                      b.put("platform", "android");
                      OutputStream os = con.getOutputStream();
                      os.write(b.toString().getBytes("UTF-8"));
                      os.close();
                      return con.getResponseCode() == 200;
                  } catch (Exception e) {
                      return false;
                  } finally {
                      if (con != null) con.disconnect();
                  }
              }
          }
          EOF

          cat > $P/app/src/main/java/com/alabdotoys/app/PushService.java <<'EOF'
          package com.alabdotoys.app;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import java.util.Map;

          /* بيستقبل الإشعار الفوري من Firebase ويعرضه فوق الشاشة (قناة "طلباتك وردودنا") */
          public class PushService extends FirebaseMessagingService {
              @Override
              public void onMessageReceived(RemoteMessage msg) {
                  Map<String, String> d = msg.getData();
                  if (d == null || d.isEmpty()) return;
                  String id = d.get("id");
                  String kind = d.get("kind") == null ? "" : d.get("kind");
                  String title = d.get("title") == null ? "متجر آل عبده" : d.get("title");
                  String body = d.get("body") == null ? "" : d.get("body");
                  String link = d.get("link") == null ? "home" : d.get("link");
                  if (id == null || id.length() == 0) id = "push" + System.currentTimeMillis();
                  if ("preq".equals(kind) && d.get("at") != null) id = id + "@" + d.get("at");
                  if (!OffersJob.notifOn(this)) return;
                  if (!OffersJob.markShown(this, id)) return;
                  OffersJob.show(this, id, title, body.length() > 0 ? body : "متجر آل عبده", link, !"stock".equals(kind));
              }

              @Override
              public void onNewToken(String token) {
                  Push.register(getApplicationContext(), token, true);
              }
          }
          EOF

      - name: Generate icons from the site's icons
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          import os
          from PIL import Image
          res = os.path.join(os.environ["P"], "app/src/main/res")
          legacy = Image.open("icon-512.png").convert("RGBA")
          maskable = Image.open("app-logo-icon-maskable-512.png" if os.path.exists("app-logo-icon-maskable-512.png") else "icon-maskable-512.png").convert("RGBA")
          dens = {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}
          for name, f in dens.items():
              d = os.path.join(res, "mipmap-" + name)
              os.makedirs(d, exist_ok=True)
              legacy.resize((round(48 * f), round(48 * f)), Image.LANCZOS).save(os.path.join(d, "ic_launcher.png"))
              maskable.resize((round(108 * f), round(108 * f)), Image.LANCZOS).save(os.path.join(d, "ic_launcher_foreground.png"))
          legacy.resize((480, 480), Image.LANCZOS).save(os.path.join(res, "drawable-xxxhdpi", "splash_logo.png"))
          # intro logo: the round store logo on a white disc (transparent outside) for the motion splash
          from PIL import ImageDraw
          lg = Image.open("logo.png").convert("RGBA")
          bb = lg.getchannel("A").point(lambda v: 255 if v > 20 else 0).getbbox()
          if bb: lg = lg.crop(bb)
          S = 552
          badge = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          m = Image.new("L", (S * 4, S * 4), 0)
          ImageDraw.Draw(m).ellipse((0, 0, S * 4 - 1, S * 4 - 1), fill=255)
          badge.paste(Image.new("RGBA", (S, S), (255, 255, 255, 255)), (0, 0), m.resize((S, S), Image.LANCZOS))
          r = int(S * 0.92) / max(lg.size)
          l2 = lg.resize((round(lg.width * r), round(lg.height * r)), Image.LANCZOS)
          badge.alpha_composite(l2, ((S - l2.width) // 2, (S - l2.height) // 2))
          badge.save(os.path.join(res, "drawable-xxxhdpi", "intro_logo.png"))
          print("intro logo ok")
          import base64, io
          # notification icons: small (round store badge: ring + bag with the letters, white) + large (the store logo in color)
          ICON_B64 = ""
          small = Image.open(io.BytesIO(base64.b64decode(ICON_B64))).convert("RGBA")
          for dn, px in {"mdpi":24, "hdpi":36, "xhdpi":48, "xxhdpi":72, "xxxhdpi":96}.items():
              dd = os.path.join(res, "drawable-" + dn); os.makedirs(dd, exist_ok=True)
              small.resize((px, px), Image.LANCZOS).save(os.path.join(dd, "ic_stat_notify.png"))
          nd = os.path.join(res, "drawable-nodpi"); os.makedirs(nd, exist_ok=True)
          Image.open("icon-512.png").convert("RGBA").resize((256, 256), Image.LANCZOS).save(os.path.join(nd, "notif_logo.png"))
          print("notification icons ok")
          print("icons ok")
          EOF

      - name: Firebase config (instant notifications)
        run: |
          python3 - <<'EOF'
          import json, os
          src = ".github/firebase/google-services.json"
          res = os.path.join(os.environ["P"], "app/src/main/res/values")
          if not os.path.exists(src):
              print("no google-services.json - building without instant notifications")
              raise SystemExit(0)
          g = json.load(open(src, encoding="utf-8"))
          pi = g.get("project_info", {})
          cl = [c for c in g.get("client", []) if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.alabdotoys.app"]
          if not cl:
              print("google-services.json has no client for com.alabdotoys.app - skipping")
              raise SystemExit(0)
          c = cl[0]
          key = (c.get("api_key") or [{}])[0].get("current_key", "")
          vals = {
              "google_app_id": c["client_info"]["mobilesdk_app_id"],
              "gcm_defaultSenderId": pi.get("project_number", ""),
              "google_api_key": key,
              "google_crash_reporting_api_key": key,
              "project_id": pi.get("project_id", ""),
              "google_storage_bucket": pi.get("storage_bucket", ""),
          }
          from xml.sax.saxutils import escape
          out = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n' + "".join('    <string name="%s" translatable="false">%s</string>\n' % (k, escape(str(v))) for k, v in vals.items() if v) + "</resources>\n"
          open(os.path.join(res, "firebase_config.xml"), "w", encoding="utf-8").write(out)
          print("firebase config ok for project", vals["project_id"])
          EOF

      - name: Build APK + AAB (unsigned)
        run: |
          set -o pipefail
          cd "$P"
          gradle assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Align APK and publish APK + AAB to branch apk-build
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools $BT"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$P/app/build/outputs/apk/release/app-release-unsigned.apk" "$OUT/alabdo-toys-unsigned.apk"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c -p 4 "$OUT/alabdo-toys-unsigned.apk"
          cp "$ANDROID_HOME/build-tools/$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
          cp "$P/app/build/outputs/bundle/release/app-release.aab" "$OUT/alabdo-toys-unsigned.aab"
          echo "ok run ${{ github.run_number }} build-tools $BT $(date -u)" > "$OUT/info.txt"
          tail -n 60 "$RUNNER_TEMP/build.log" > "$OUT/build.log"
          cd "$OUT"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/apk-build

      - name: Save build log on failure (branch apk-build)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logrepo" && cd "$RUNNER_TEMP/logrepo"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$RUNNER_TEMP/build.log" ]; then tail -n 400 "$RUNNER_TEMP/build.log" > build.log; else echo "failed before the Gradle build step" > build.log; fi
          echo "FAILED run ${{ github.run_number }} at $(date -u)" > info.txt
          git add . && git commit -q -m "build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/apk-build
