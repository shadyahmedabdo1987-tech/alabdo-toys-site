              private void hideSplash() {
                  if (splashHidden || splash == null) return;
                  long left = SPLASH_MIN_MS - (android.os.SystemClock.uptimeMillis() - splashStart);
                  if (left > 0) {
                      new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                          @Override public void run() { hideSplash(); }
                      }, left);
                      return;
                  }
                  splashHidden = true;
                  if (splashLogo != null) splashLogo.animate().scaleX(1.2f).scaleY(1.2f).setDuration(360).start();
                  splash.animate().alpha(0f).scaleX(1.05f).scaleY(1.05f).setDuration(360)
                      .setInterpolator(new android.view.animation.AccelerateInterpolator())
                      .withEndAction(new Runnable() {
                      @Override public void run() {
                          splash.setVisibility(View.GONE);
                          for (android.animation.Animator a : splashAnims) a.cancel();
                          splashAnims.clear();
                      }
                  }).start();
              }

              private static void setHeight(View v, int h) {
                  ViewGroup.LayoutParams lp = v.getLayoutParams();
                  if (lp != null && lp.height != h) { lp.height = h; v.setLayoutParams(lp); }
              }

              private String startUrl(Intent intent) {
                  /* جاي من إشعار المخزون: نفتح المنتجات على فلتر "خلصت" أو "قربت تخلص" */
                  String f = intent != null ? intent.getStringExtra("admf") : null;
                  if (isAdmf(f)) return HOME.replace("?source=admin", "?source=admin&admf=" + f);
                  return HOME;
              }

              /* الشاشات اللي الإشعارات بتفتحها: خلصت / قربت تخلص / الطلبات / الاستفسارات / طلبات التوفر */
              private static boolean isAdmf(String f) {
                  return "out".equals(f) || "low".equals(f) || "orders".equals(f) || "inquiries".equals(f) || "stock".equals(f) || "customers".equals(f);
              }

              /* أندرويد 13 وأحدث: لازم توافق على الإشعارات (بنسأل مرة واحدة) */
              /* بترجع true لو ظهر سؤال الإذن دلوقتي */
              private boolean askNotificationPermissionOnce() {
                  if (Build.VERSION.SDK_INT < 33) return false;
                  if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED) return false;
                  android.content.SharedPreferences sp = getSharedPreferences(StockWatchJob.PREFS, MODE_PRIVATE);
                  if (sp.getBoolean("asked_notif", false)) return false;
                  sp.edit().putBoolean("asked_notif", true).apply();
                  requestPermissions(new String[]{ Manifest.permission.POST_NOTIFICATIONS }, 2001);
                  return true;
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  if (!askNotificationPermissionOnce()) askBatteryExemptionOnce();
                  try { StockWatchJob.ensureScheduled(this); } catch (Exception e) { /* ignore */ }
                  /* المتابعة في الخلفية: الإشعارات بتوصل حتى لو التطبيق مقفول */
                  WatchService.start(this);
                  WatchTick.scheduleNext(this, 60000L);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 2001) {
                      WatchService.start(this); /* نحدّث الإشعار الثابت بعد الموافقة */
                      askBatteryExemptionOnce();
                  }
              }

              /* نطلب من أندرويد ما يوقّفش التطبيق عشان توفير البطارية (مرة واحدة بس) -
                 من غيرها ممكن الإشعارات تتأخر أو ما توصلش والتطبيق مقفول. */
              private void askBatteryExemptionOnce() {
                  if (Build.VERSION.SDK_INT < 23) return;
                  try {
                      android.os.PowerManager pm = (android.os.PowerManager) getSystemService(POWER_SERVICE);
                      if (pm == null || pm.isIgnoringBatteryOptimizations(getPackageName())) return;
                      android.content.SharedPreferences sp = getSharedPreferences(StockWatchJob.PREFS, MODE_PRIVATE);
                      if (sp.getBoolean("asked_battery", false)) return;
                      sp.edit().putBoolean("asked_battery", true).apply();
                      Intent i = new Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName()));
                      startActivity(i);
                  } catch (Exception e) { /* some phones don't have this screen */ }
              }

              private static boolean isOwnSite(Uri u) {
                  String scheme = u.getScheme();
                  String host = u.getHost();
                  return ("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme))
                      && host != null && (host.equalsIgnoreCase(HOST) || host.toLowerCase().endsWith("." + HOST));
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setTextZoom(100);
                  s.setSupportZoom(false);
                  s.setAllowFileAccess(false);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUserAgentString(s.getUserAgentString() + " AlAbdoAdmin/7");
                  CookieManager.getInstance().setAcceptCookie(true);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl());
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          /* نسخة قديمة من الموقع (من غير appReady)؟ نقفل الشاشة على طول */
                          if (splashHidden) return;
                          view.evaluateJavascript("window.AA_SPLASH===1", new ValueCallback<String>() {
                              @Override public void onReceiveValue(String v) { if (!"true".equals(v)) hideSplash(); }
                          });
                      }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) showOffline();
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          return openFileChooser(callback, params);
                      }
                      /* أي رسالة تأكيد/تنبيه من الصفحة: بشكل التطبيق، من غير "The page at ... displays" */
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final android.webkit.JsResult result) {
                          new android.app.AlertDialog.Builder(view.getContext(), android.R.style.Theme_DeviceDefault_Light_Dialog_Alert)
                              .setMessage(message)
                              .setPositiveButton("تمام", (d, w) -> result.confirm())
                              .setOnCancelListener(d -> result.cancel())
                              .show();
                          return true;
                      }
                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final android.webkit.JsResult result) {
                          new android.app.AlertDialog.Builder(view.getContext(), android.R.style.Theme_DeviceDefault_Light_Dialog_Alert)
                              .setMessage(message)
                              .setPositiveButton("تمام", (d, w) -> result.confirm())
                              .setNegativeButton("إلغاء", (d, w) -> result.cancel())
                              .setOnCancelListener(d -> result.cancel())
                              .show();
                          return true;
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> openExternal(Uri.parse(url)));
                  web.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void saveFile(final String name, final String mime, final String content) {
                          runOnUiThread(new Runnable() { @Override public void run() { saveToDownloads(name, mime, content); } });
                      }
                      /* تنزيل صورة (سكرين شوت تحويل العميل) - بتيجي base64 من الموقع
                         وبتتحفظ في Downloads وبتظهر في المعرض. */
                      @android.webkit.JavascriptInterface
                      public void saveBase64(final String name, final String mime, final String b64) {
                          final byte[] bytes;
                          try { bytes = android.util.Base64.decode(b64 == null ? "" : b64, android.util.Base64.DEFAULT); }
                          catch (Exception e) {
                              runOnUiThread(new Runnable() { @Override public void run() {
                                  android.widget.Toast.makeText(MainActivity.this, "⚠️ الصورة مش سليمة، جرّب تاني", android.widget.Toast.LENGTH_LONG).show();
                              } });
                              return;
                          }
                          final boolean isImg = mime != null && mime.startsWith("image/");
                          runOnUiThread(new Runnable() { @Override public void run() {
                              if (isImg) saveBytes(name, mime, bytes, "✅ اتحفظ الإيصال في Downloads وفي المعرض: ", "احفظ الإيصال");
                              else saveBytes(name, mime, bytes, "✅ اتحفظ الملف في Downloads: ", "احفظ الملف");
                          } });
                      }
                      /* طباعة تقرير PDF: بتفتح شاشة الطباعة بتاعة أندرويد (طابعة واي فاي
                         أو "حفظ كـ PDF") */
                      @android.webkit.JavascriptInterface
                      public void printPdf(final String name, final String b64) {
                          final byte[] bytes;
                          try { bytes = android.util.Base64.decode(b64 == null ? "" : b64, android.util.Base64.DEFAULT); }
                          catch (Exception e) { return; }
                          runOnUiThread(new Runnable() { @Override public void run() { printPdfBytes(name, bytes); } });
                      }
                      /* مفتاح إشعارات الطلبات (بيتحفظ على الموبايل بس) */
                      @android.webkit.JavascriptInterface
                      public void setNotifyToken(String token) {
                          StockWatchJob.setNotifyToken(getApplicationContext(), token);
                          if (token != null && !token.isEmpty()) {
                              try { StockWatchJob.ensureScheduled(getApplicationContext()); } catch (Exception e) { /* ignore */ }
                          }
                      }
                      @android.webkit.JavascriptInterface
                      public boolean hasNotifyToken() { return !StockWatchJob.getNotifyToken(getApplicationContext()).isEmpty(); }
                      @android.webkit.JavascriptInterface
                      public String getNotifyToken() { return StockWatchJob.getNotifyToken(getApplicationContext()); }
                      /* أول ما الأدمن يفتح فاتورة الطلب: إشعار الطلب ده بيتشال من
                         شريط الإشعارات (نفس رقم الإشعار اللي اتعمل بيه في StockWatchJob) */
                      @android.webkit.JavascriptInterface
                      public void clearOrderNotification(String orderId) {
                          if (orderId == null || orderId.isEmpty()) return;
                          try {
                              android.app.NotificationManager nm = (android.app.NotificationManager) getSystemService(android.content.Context.NOTIFICATION_SERVICE);
                              if (nm != null) nm.cancel(4000 + (orderId.hashCode() & 0x3fff));
                          } catch (Exception e) { /* ignore */ }
                      }
                      /* كل الطلبات اتفتحت: بيشيل كمان إشعار "X طلبات جديدة" المجمّع */
                      @android.webkit.JavascriptInterface
                      public void clearOrderNotifications() {
                          try {
                              android.app.NotificationManager nm = (android.app.NotificationManager) getSystemService(android.content.Context.NOTIFICATION_SERVICE);
                              if (nm != null) nm.cancel(3000 + ("orders".hashCode() & 0x1ff));
                          } catch (Exception e) { /* ignore */ }
                      }
                      @android.webkit.JavascriptInterface
                      public void appReady() {
                          runOnUiThread(new Runnable() { @Override public void run() { hideSplash(); } });
                      }
                  }, "AlAbdoNative");
              }

              /* حفظ ملف النسخة الاحتياطية: في Downloads على أندرويد 10 وأحدث،
                 ولأقدم من كده بيفتح قايمة المشاركة (تحفظه في Drive أو تبعته لنفسك). */
              private void printPdfBytes(final String name, final byte[] data) {
                  try {
                      android.print.PrintManager pm = (android.print.PrintManager) getSystemService(android.content.Context.PRINT_SERVICE);
                      if (pm == null) throw new Exception("no print service");
                      final String job = (name == null || name.isEmpty()) ? "alabdo-report" : name.replaceAll("\\.pdf$", "");
                      android.print.PrintDocumentAdapter adapter = new android.print.PrintDocumentAdapter() {
                          @Override
                          public void onLayout(android.print.PrintAttributes oldAttributes, android.print.PrintAttributes newAttributes, android.os.CancellationSignal cancellationSignal, android.print.PrintDocumentAdapter.LayoutResultCallback callback, Bundle extras) {
                              if (cancellationSignal != null && cancellationSignal.isCanceled()) { callback.onLayoutCancelled(); return; }
                              android.print.PrintDocumentInfo info = new android.print.PrintDocumentInfo.Builder(job + ".pdf")
                                  .setContentType(android.print.PrintDocumentInfo.CONTENT_TYPE_DOCUMENT).build();
                              callback.onLayoutFinished(info, true);
                          }
                          @Override
                          public void onWrite(android.print.PageRange[] pages, android.os.ParcelFileDescriptor destination, android.os.CancellationSignal cancellationSignal, android.print.PrintDocumentAdapter.WriteResultCallback callback) {
                              java.io.FileOutputStream out = null;
                              try {
                                  out = new java.io.FileOutputStream(destination.getFileDescriptor());
                                  out.write(data);
                                  callback.onWriteFinished(new android.print.PageRange[] { android.print.PageRange.ALL_PAGES });
                              } catch (Exception e) {
                                  callback.onWriteFailed(e.getMessage());
                              } finally {
                                  try { if (out != null) out.close(); } catch (Exception e2) { /* ignore */ }
                              }
                          }
                      };
                      pm.print(job, adapter, new android.print.PrintAttributes.Builder().setMediaSize(android.print.PrintAttributes.MediaSize.ISO_A4).build());
                  } catch (Exception e) {
                      android.widget.Toast.makeText(this, "⚠️ الطباعة مش متاحة على الموبايل ده — نزّل الـ PDF واطبعه", android.widget.Toast.LENGTH_LONG).show();
                  }
              }

              private void saveToDownloads(String name, String mime, String content) {
                  String type = (mime == null || mime.isEmpty()) ? "application/json" : mime;
                  byte[] data = content == null ? new byte[0] : content.getBytes(java.nio.charset.StandardCharsets.UTF_8);
                  saveBytes((name == null || name.isEmpty()) ? "alabdo-backup.json" : name, type, data, "✅ اتحفظت النسخة الاحتياطية في فولدر Downloads: ", "احفظ النسخة الاحتياطية");
              }

              private void saveBytes(String name, String mime, byte[] data, String okMsg, String shareTitle) {
                  String safeName = (name == null || name.isEmpty()) ? "alabdo-file" : name.replaceAll("[\\/:*?\"<>|]", "_");
                  String type = (mime == null || mime.isEmpty()) ? "application/octet-stream" : mime;
                  if (data == null) data = new byte[0];
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          android.content.ContentValues v = new android.content.ContentValues();
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                          v.put(MediaStore.MediaColumns.MIME_TYPE, type);
                          v.put(MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (uri == null) throw new java.io.IOException("insert failed");
                          java.io.OutputStream os = getContentResolver().openOutputStream(uri);
                          if (os == null) throw new java.io.IOException("open failed");
                          try { os.write(data); } finally { os.close(); }
                          android.widget.Toast.makeText(this, okMsg + safeName, android.widget.Toast.LENGTH_LONG).show();
                      } else {
                          File dir = new File(getCacheDir(), "exports");
                          if (!dir.exists()) dir.mkdirs();
                          File f = new File(dir, safeName);
                          java.io.FileOutputStream fos = new java.io.FileOutputStream(f);
                          try { fos.write(data); } finally { fos.close(); }
                          Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                          Intent send = new Intent(Intent.ACTION_SEND);
                          send.setType(type);
                          send.putExtra(Intent.EXTRA_STREAM, uri);
                          send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          startActivity(Intent.createChooser(send, shareTitle));
                      }
                  } catch (Exception e) {
                      android.widget.Toast.makeText(this, "⚠️ معرفناش نحفظ الملف، جرّب تاني", android.widget.Toast.LENGTH_LONG).show();
                  }
              }

              /* لينكات الموقع بتفضل جوه التطبيق، وأي حاجة تانية بتفتح برّه */
              private boolean handleUrl(Uri u) {
                  if (u == null) return false;
                  if (isOwnSite(u)) return false;
                  String scheme = u.getScheme() == null ? "" : u.getScheme().toLowerCase();
                  if (scheme.equals("intent")) {
                      try {
                          Intent i = Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME);
                          try { startActivity(i); }
                          catch (ActivityNotFoundException e) {
                              String fb = i.getStringExtra("browser_fallback_url");
                              if (fb != null) openExternal(Uri.parse(fb));
                          }
                      } catch (Exception e) { /* ignore */ }
                      return true;
                  }
                  openExternal(u);
                  return true;
              }

              private void openExternal(Uri u) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, u);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) { /* no app for this link */ }
              }

              private void showOffline() {
                  String html = "<!doctype html><html dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>"
