              /* فحص الخلفية كل نص ساعة (أقل حاجة أندرويد بيسمح بيها 15 دقيقة) */
              static final long PERIOD = 30L * 60L * 1000L;
              /* قناة تحديثات الطلب والردود: بتظهر فوق الشاشة بصوت */
              static final String CH_ORDERS = "orders_v1";

              static void ensureScheduled(Context c) {
