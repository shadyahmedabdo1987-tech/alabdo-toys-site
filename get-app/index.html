<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تطبيق متجر آل عبده</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#fae568;color:#1b2a4e;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
.c{padding:24px}img{width:110px;height:110px;border-radius:50%;background:#fff}a{display:block;margin:14px auto;max-width:260px;padding:14px;border-radius:14px;background:#1b2a4e;color:#fae568;font-weight:800;text-decoration:none}</style>
</head><body><div class="c"><img src="/logo.png" alt=""><h2>جاري فتح تطبيق متجر آل عبده…</h2>
<a href="https://apps.apple.com/eg/app/id6826082617">🍏 App Store للآيفون</a>
<a href="https://play.google.com/store/apps/details?id=com.alabdotoys.app">🤖 Google Play للأندرويد</a></div>
<script>
(function(){
  var IOS="https://apps.apple.com/eg/app/id6826082617", AND="https://play.google.com/store/apps/details?id=com.alabdotoys.app";
  var q=new URLSearchParams(location.search), p=(q.get("p")||"").toLowerCase(), src=(q.get("src")||"qr_ad").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,24);
  var ua=navigator.userAgent||"";
  var isIOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1), isAnd=/Android/i.test(ua);
  var target = isIOS ? "ios" : isAnd ? "android" : (p==="android" ? "android" : "ios");
  var vid; try{ vid=localStorage.getItem("aa_vid"); if(!vid){ vid="v"+Date.now().toString(36)+Math.random().toString(36).slice(2,10); localStorage.setItem("aa_vid",vid); } localStorage.setItem("aa_src", JSON.stringify({s:src,t:Date.now()})); }catch(e){ vid="q"+Math.random().toString(36).slice(2,12); }
  var go=function(){ location.replace(target==="android"?AND:IOS); };
  try{
    fetch("/api/analytics",{method:"POST",keepalive:true,headers:{"content-type":"application/json"},body:JSON.stringify({visitorId:vid,event:target==="android"?"qrScanAndroid":"qrScanIos",src:src})}).then(go,go);
  }catch(e){ go(); }
  setTimeout(go,1200);
})();
</script></body></html>
