# متجر آل عبده - بناء تطبيق أندرويد أوتوماتيك على سيرفرات GitHub.
# التطبيق بيفتح الموقع الحقيقي https://alabdo-toys.com جوه متصفح داخلي خاص
# بيه (WebView) - من غير جوجل كروم خالص، فمفيش أي رسالة من كروم أول مرة،
# وأي تعديل في الموقع بيظهر في التطبيق على طول.
#
# الملف ده بيبني ملف APK (للتثبيت المباشر) وملف AAB (لجوجل بلاي) ويحطهم في
# فرع apk-build من غير توقيع - التوقيع بيحصل برّه بمفتاح المتجر عشان
# المفتاح ميترفعش على الإنترنت أبدًا.
# وتقدر تشغّله تاني يدوي من Actions ← Build Android APK ← Run workflow.

# icons: round store logo only, transparent background (app-logo-icon-maskable-512.png)
# haptics: AlAbdoNative.haptic (add to cart / checkout taps / order success)
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Python (for icons)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Android project
        run: |
          set -e
          P="$RUNNER_TEMP/android-app"
          echo "P=$P" >> "$GITHUB_ENV"
          mkdir -p $P/app/src/main/java/com/alabdotoys/app $P/app/src/main/res/values $P/app/src/main/res/values-v31 $P/app/src/main/res/xml $P/app/src/main/res/drawable $P/app/src/main/res/drawable-xxxhdpi $P/app/src/main/res/mipmap-anydpi-v26

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AlAbdoToys"
          include ":app"
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.alabdotoys.app'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.alabdotoys.app'
                  minSdk 24
                  targetSdk 36
                  versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
                  versionName '2.0.' + (System.getenv('APP_VERSION_CODE') ?: '1')
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:enableOnBackInvokedCallback="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="alabdo-toys.com" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CartReminderJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">متجر آل عبده</string>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="brandPink">#EE1F6C</color>
              <color name="splashBg">#FFF8EF</color>
              <color name="iconBackground">#00000000</color>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash_bg</item>
                  <item name="android:statusBarColor">@color/brandPink</item>
                  <item name="android:colorPrimary">@color/brandPink</item>
                  <item name="android:colorAccent">@color/brandPink</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/values-v31/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/splashBg</item>
                  <item name="android:statusBarColor">@color/brandPink</item>
                  <item name="android:colorPrimary">@color/brandPink</item>
                  <item name="android:colorAccent">@color/brandPink</item>
                  <item name="android:windowSplashScreenBackground">@color/splashBg</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/drawable/splash_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/splashBg" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/splash_logo" />
              </item>
          </layer-list>
          EOF

          cat > $P/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="camera" path="camera/" />
          </paths>
          EOF

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/iconBackground" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > $P/app/src/main/java/com/alabdotoys/app/MainActivity.java <<'EOF'
          package com.alabdotoys.app;

          import android.animation.ObjectAnimator;
          import android.animation.ValueAnimator;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Insets;
          import android.net.Uri;
          import android.os.Build;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.animation.LinearInterpolator;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.window.OnBackInvokedDispatcher;

          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.util.ArrayList;

          /* متجر آل عبده - التطبيق بيفتح الموقع جوه متصفح داخلي خاص بيه (WebView)
             من غير جوجل كروم خالص، فمفيش أي رسالة من كروم بتظهر أول مرة.
             - لينكات الموقع بتفتح جوه التطبيق، وأي لينك برّه (واتساب، تليفون،
               فيسبوك...) بيفتح في التطبيق المناسب على الموبايل.
             - رفع الصور (زي سكرين شوت التحويل) من المعرض أو الكاميرا.
             - زرار الرجوع بيرجع خطوة جوه الموقع قبل ما يقفل التطبيق. */
          public class MainActivity extends Activity {
              private static final String HOST = "alabdo-toys.com";
              private static final String HOME = "https://alabdo-toys.com/?source=app";
              private static final int REQ_FILE = 1001;

              private WebView web;
              private View topBar, bottomBar, splash;
              private ValueCallback<Uri[]> fileCallback;
              private Uri cameraUri;
              private boolean splashHidden = false;
              /* التطبيق ظاهر قدام العميل دلوقتي؟ (تذكير السلة مش بيطلع وهو فاتح التطبيق) */
              static volatile boolean foreground = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  boolean night = (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
                  int bottomColor = night ? 0xFF271C3F : 0xFFFFFFFF;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFFFFF8EF);
                  topBar = new View(this);
                  topBar.setBackgroundColor(0xFFEE1F6C);
                  bottomBar = new View(this);
                  bottomBar.setBackgroundColor(bottomColor);
                  FrameLayout content = new FrameLayout(this);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFFFFF8EF);
                  content.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  splash = buildSplash();
                  content.addView(splash, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  root.addView(topBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0));
                  root.addView(content, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  root.addView(bottomBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0));
                  setContentView(root);

                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                      root.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                          @Override
                          public WindowInsets onApplyWindowInsets(View v, WindowInsets insets) {
                              Insets sys = insets.getInsets(WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout());
                              Insets ime = insets.getInsets(WindowInsets.Type.ime());
                              setHeight(topBar, sys.top);
                              setHeight(bottomBar, Math.max(sys.bottom, ime.bottom));
                              v.setPadding(sys.left, 0, sys.right, 0);
                              return WindowInsets.CONSUMED;
                          }
                      });
                      WindowInsetsController c = w.getInsetsController();
                      if (c != null) {
                          int mask = WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS | WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS;
                          c.setSystemBarsAppearance(night ? 0 : WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS, mask);
                      }
                  } else {
                      w.setStatusBarColor(0xFFEE1F6C);
                      if (Build.VERSION.SDK_INT >= 26) {
                          w.setNavigationBarColor(bottomColor);
                          if (!night) w.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
                      } else {
                          w.setNavigationBarColor(Color.BLACK);
                      }
                  }

                  setupWebView();

                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(OnBackInvokedDispatcher.PRIORITY_DEFAULT, new android.window.OnBackInvokedCallback() {
                          @Override
                          public void onBackInvoked() { goBackOrClose(); }
                      });
                  }

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(startUrl(getIntent()));
                  }
                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override public void run() { hideSplash(); }
                  }, 15000);
              }

              /* شاشة الافتتاح (موشن): اللوجو بيظهر بنطّة وبيلف لفة 3D، حواليه
                 موجات وردي بتتسع ونقط ملونة بتطير وتلف في مدار، وتحته اسم المتجر
                 والشعار بيطلعوا واحدة واحدة، ونقط تحميل بتتنطط. بتفضل ظاهرة لحد
                 ما الصفحة تبلغنا إن المنتجات حملت (appReady) - بس مش أقل من مدة
                 الحركة الأساسية - وبحد أقصى 15 ثانية لو النت بطيء جدًا. */
              private static final long SPLASH_MIN_MS = 1900;
              private long splashStart = 0;
              private View splashLogo;
              private final ArrayList<android.animation.Animator> splashAnims = new ArrayList<>();

              private android.graphics.drawable.GradientDrawable oval(int fill, int strokeColor, int strokeW) {
                  android.graphics.drawable.GradientDrawable g = new android.graphics.drawable.GradientDrawable();
                  g.setShape(android.graphics.drawable.GradientDrawable.OVAL);
                  g.setColor(fill);
                  if (strokeW > 0) g.setStroke(strokeW, strokeColor);
                  return g;
              }

              private void play(android.animation.Animator a) { splashAnims.add(a); a.start(); }

              private boolean animsOn() {
                  return Build.VERSION.SDK_INT < 26 || ValueAnimator.areAnimatorsEnabled();
              }

              private View buildSplash() {
                  final float d = getResources().getDisplayMetrics().density;
                  final boolean loops = animsOn();
                  splashStart = android.os.SystemClock.uptimeMillis();

                  FrameLayout f = new FrameLayout(this);
                  f.setBackgroundColor(0xFFFFF8EF);
                  f.setClickable(true);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER_HORIZONTAL);
                  f.addView(col, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER));

                  int stageSize = (int) (290 * d);
                  FrameLayout stage = new FrameLayout(this);
                  stage.setClipChildren(false);
                  col.setClipChildren(false);
                  f.setClipChildren(false);
                  col.addView(stage, new LinearLayout.LayoutParams(stageSize, stageSize));

                  /* هالة ناعمة ورا اللوجو */
                  View glow = new View(this);
                  android.graphics.drawable.GradientDrawable gd = new android.graphics.drawable.GradientDrawable();
                  gd.setShape(android.graphics.drawable.GradientDrawable.OVAL);
                  gd.setGradientType(android.graphics.drawable.GradientDrawable.RADIAL_GRADIENT);
                  gd.setColors(new int[]{0x55EE1F6C, 0x33FFB703, 0x00FFF8EF});
                  gd.setGradientRadius(stageSize / 2f);
                  glow.setBackground(gd);
                  glow.setAlpha(0f);
                  stage.addView(glow, new FrameLayout.LayoutParams(stageSize, stageSize, Gravity.CENTER));

                  /* موجتين وردي بيتسعوا من اللوجو */
                  int logoSize = (int) (138 * d);
                  for (int i = 0; i < 2; i++) {
                      View ring = new View(this);
                      ring.setBackground(oval(0x00000000, i == 0 ? 0xFFEE1F6C : 0xFFFFB703, (int) (2.5f * d)));
                      ring.setAlpha(0f);
                      stage.addView(ring, new FrameLayout.LayoutParams(logoSize, logoSize, Gravity.CENTER));
                      android.animation.PropertyValuesHolder sx = android.animation.PropertyValuesHolder.ofFloat("scaleX", 1f, 2.05f);
                      android.animation.PropertyValuesHolder sy = android.animation.PropertyValuesHolder.ofFloat("scaleY", 1f, 2.05f);
                      android.animation.PropertyValuesHolder al = android.animation.PropertyValuesHolder.ofFloat("alpha", 0.55f, 0f);
                      ObjectAnimator r = ObjectAnimator.ofPropertyValuesHolder(ring, sx, sy, al);
                      r.setDuration(1700);
                      r.setStartDelay(350 + i * 850);
                      r.setInterpolator(new android.view.animation.DecelerateInterpolator());
                      if (loops) r.setRepeatCount(ValueAnimator.INFINITE);
                      play(r);
                  }

                  /* نقط ملونة بتطير من ورا اللوجو وتفضل تلف حواليه */
                  FrameLayout orbit = new FrameLayout(this);
                  orbit.setClipChildren(false);
                  stage.addView(orbit, new FrameLayout.LayoutParams(stageSize, stageSize, Gravity.CENTER));
                  int[] colors = {0xFFEE1F6C, 0xFFFFB703, 0xFF1FA9DD, 0xFF1FB87F, 0xFF8E24AA, 0xFFFF7A45, 0xFFEE1F6C, 0xFF1FA9DD};
                  float[] sizes = {12, 9, 11, 8, 10, 7, 8, 9};
                  float[] radii = {118, 104, 124, 110, 120, 100, 126, 112};
                  for (int i = 0; i < colors.length; i++) {
                      View dot = new View(this);
                      dot.setBackground(oval(colors[i], 0, 0));
                      int s = (int) (sizes[i] * d);
                      orbit.addView(dot, new FrameLayout.LayoutParams(s, s, Gravity.CENTER));
                      double ang = Math.toRadians(i * 45 + 20);
                      float tx = (float) (Math.cos(ang) * radii[i] * d), ty = (float) (Math.sin(ang) * radii[i] * d);
                      dot.setAlpha(0f); dot.setScaleX(0.3f); dot.setScaleY(0.3f);
                      android.animation.PropertyValuesHolder px = android.animation.PropertyValuesHolder.ofFloat("translationX", 0f, tx);
                      android.animation.PropertyValuesHolder py = android.animation.PropertyValuesHolder.ofFloat("translationY", 0f, ty);
                      android.animation.PropertyValuesHolder pa = android.animation.PropertyValuesHolder.ofFloat("alpha", 0f, 1f);
                      android.animation.PropertyValuesHolder ps = android.animation.PropertyValuesHolder.ofFloat("scaleX", 0.3f, 1f);
                      android.animation.PropertyValuesHolder pt = android.animation.PropertyValuesHolder.ofFloat("scaleY", 0.3f, 1f);
                      ObjectAnimator b = ObjectAnimator.ofPropertyValuesHolder(dot, px, py, pa, ps, pt);
                      b.setDuration(700);
                      b.setStartDelay(320 + i * 40);
                      b.setInterpolator(new android.view.animation.OvershootInterpolator(1.6f));
                      play(b);
                  }
                  if (loops) {
                      ObjectAnimator spin = ObjectAnimator.ofFloat(orbit, "rotation", 0f, 360f);
                      spin.setDuration(9000);
                      spin.setInterpolator(new LinearInterpolator());
                      spin.setRepeatCount(ValueAnimator.INFINITE);
                      play(spin);
                  }

                  /* اللوجو: بيظهر بنطّة، يلف لفة 3D، وبعدين بيطفو بهدوء */
                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.intro_logo);
                  logo.setCameraDistance(9000 * d);
                  logo.setElevation(8 * d);
                  logo.setAlpha(0f); logo.setScaleX(0.45f); logo.setScaleY(0.45f);
                  stage.addView(logo, new FrameLayout.LayoutParams(logoSize, logoSize, Gravity.CENTER));
                  splashLogo = logo;
                  logo.setOutlineProvider(new android.view.ViewOutlineProvider() {
                      @Override public void getOutline(View v, android.graphics.Outline o) { o.setOval(0, 0, v.getWidth(), v.getHeight()); }
                  });

                  ObjectAnimator glowIn = ObjectAnimator.ofFloat(glow, "alpha", 0f, 1f);
                  glowIn.setDuration(600);
                  play(glowIn);
                  ObjectAnimator pop = ObjectAnimator.ofPropertyValuesHolder(logo,
                      android.animation.PropertyValuesHolder.ofFloat("alpha", 0f, 1f),
                      android.animation.PropertyValuesHolder.ofFloat("scaleX", 0.45f, 1f),
                      android.animation.PropertyValuesHolder.ofFloat("scaleY", 0.45f, 1f));
                  pop.setDuration(620);
                  pop.setStartDelay(80);
                  pop.setInterpolator(new android.view.animation.OvershootInterpolator(2.2f));
                  play(pop);
                  ObjectAnimator flip = ObjectAnimator.ofFloat(logo, "rotationY", 0f, 360f);
                  flip.setDuration(2400);
                  flip.setStartDelay(700);
                  /* لفة ناعمة في أول 45% من الوقت وبعدين وقفة قبل اللفة الجاية */
                  flip.setInterpolator(new android.animation.TimeInterpolator() {
                      @Override public float getInterpolation(float t) {
                          if (t >= 0.45f) return 1f;
                          float x = t / 0.45f;
                          return (float) ((1 - Math.cos(x * Math.PI)) / 2);
                      }
                  });
                  if (loops) {
                      /* بعد كده لفة كل شوية طول ما الصفحة بتحمل */
                      flip.setRepeatCount(ValueAnimator.INFINITE);
                      flip.setRepeatMode(ValueAnimator.RESTART);
                  }
                  play(flip);
                  if (loops) {
                      ObjectAnimator fl = ObjectAnimator.ofFloat(glow, "scaleX", 0.92f, 1.08f);
                      ObjectAnimator fl2 = ObjectAnimator.ofFloat(glow, "scaleY", 0.92f, 1.08f);
                      for (ObjectAnimator a : new ObjectAnimator[]{fl, fl2}) {
                          a.setDuration(1500);
                          a.setStartDelay(600);
                          a.setRepeatCount(ValueAnimator.INFINITE);
                          a.setRepeatMode(ValueAnimator.REVERSE);
                          a.setInterpolator(new android.view.animation.AccelerateDecelerateInterpolator());
                          play(a);
                      }
                  }

                  /* اسم المتجر والشعار */
                  android.widget.TextView name = new android.widget.TextView(this);
                  name.setText("متجر آل عبده");
                  name.setTextColor(0xFFB6135A);
                  name.setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP, 27);
                  name.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
                  name.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams nlp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  nlp.topMargin = (int) (4 * d);
                  col.addView(name, nlp);

                  android.widget.TextView tag = new android.widget.TextView(this);
                  tag.setText("متعة أكبر .. طفولة أجمل");
                  tag.setTextColor(0xFF6B6080);
                  tag.setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP, 15);
                  tag.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams tlp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  tlp.topMargin = (int) (4 * d);
                  col.addView(tag, tlp);

                  View[] texts = {name, tag};
                  for (int i = 0; i < texts.length; i++) {
                      texts[i].setAlpha(0f);
                      texts[i].setTranslationY(18 * d);
                      ObjectAnimator a = ObjectAnimator.ofPropertyValuesHolder(texts[i],
                          android.animation.PropertyValuesHolder.ofFloat("alpha", 0f, 1f),
                          android.animation.PropertyValuesHolder.ofFloat("translationY", 18 * d, 0f));
                      a.setDuration(520);
                      a.setStartDelay(620 + i * 180);
                      a.setInterpolator(new android.view.animation.DecelerateInterpolator(1.6f));
                      play(a);
                  }

                  /* نقط التحميل */
                  LinearLayout loader = new LinearLayout(this);
                  loader.setOrientation(LinearLayout.HORIZONTAL);
                  loader.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams llp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, (int) (26 * d));
                  llp.topMargin = (int) (22 * d);
                  col.addView(loader, llp);
                  loader.setAlpha(0f);
                  int[] lc = {0xFFEE1F6C, 0xFFFFB703, 0xFF1FA9DD};
                  for (int i = 0; i < 3; i++) {
                      View dt = new View(this);
                      dt.setBackground(oval(lc[i], 0, 0));
                      int s = (int) (9 * d);
                      LinearLayout.LayoutParams dlp = new LinearLayout.LayoutParams(s, s);
                      dlp.leftMargin = dlp.rightMargin = (int) (4 * d);
                      loader.addView(dt, dlp);
                      if (loops) {
                          ObjectAnimator bo = ObjectAnimator.ofFloat(dt, "translationY", 0f, -9 * d);
                          bo.setDuration(360);
                          bo.setStartDelay(1100 + i * 120);
                          bo.setRepeatCount(ValueAnimator.INFINITE);
                          bo.setRepeatMode(ValueAnimator.REVERSE);
                          bo.setInterpolator(new android.view.animation.AccelerateDecelerateInterpolator());
                          play(bo);
                      }
                  }
                  ObjectAnimator lIn = ObjectAnimator.ofFloat(loader, "alpha", 0f, 1f);
                  lIn.setDuration(400);
                  lIn.setStartDelay(1100);
                  play(lIn);
                  return f;
              }

              private void hideSplash() {
                  if (splashHidden || splash == null) return;
                  long left = SPLASH_MIN_MS - (android.os.SystemClock.uptimeMillis() - splashStart);
                  if (left > 0) {
                      new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                          @Override public void run() { hideSplash(); }
                      }, left);
                      return;
                  }
                  splashHidden = true;
                  if (splashLogo != null) splashLogo.animate().scaleX(1.18f).scaleY(1.18f).setDuration(380).start();
                  splash.animate().alpha(0f).scaleX(1.05f).scaleY(1.05f).setDuration(380)
                      .setInterpolator(new android.view.animation.AccelerateInterpolator())
                      .withEndAction(new Runnable() {
                      @Override public void run() {
                          splash.setVisibility(View.GONE);
                          for (android.animation.Animator a : splashAnims) a.cancel();
                          splashAnims.clear();
                      }
                  }).start();
              }

              /* الصفحة بتنادي AlAbdoNative.appReady() لما المنتجات تترسم */
              private class SplashBridge {
                  @JavascriptInterface
                  public void appReady() {
                      runOnUiThread(new Runnable() {
                          @Override public void run() { hideSplash(); }
                      });
                  }
                  /* اهتزاز خفيف: إضافة للسلة / ضغطات إتمام الطلب / نجاح الطلب */
                  @JavascriptInterface
                  public void haptic(final String kind) {
                      runOnUiThread(new Runnable() {
                          @Override public void run() { doHaptic(kind); }
                      });
                  }
                  /* الصفحة بتبلغنا بعدد المنتجات اللي في السلة (عشان تذكير السلة) */
                  @JavascriptInterface
                  public void cartChanged(int count, String names) {
                      CartReminderJob.saveCart(getApplicationContext(), count, names);
                      if (count > 0) runOnUiThread(new Runnable() {
                          @Override public void run() { askNotificationPermissionOnce(); }
                      });
                  }
              }

              @SuppressWarnings("deprecation")
              private void doHaptic(String kind) {
                  try {
                      android.os.Vibrator v;
                      if (Build.VERSION.SDK_INT >= 31) {
                          android.os.VibratorManager vm = (android.os.VibratorManager) getSystemService(android.content.Context.VIBRATOR_MANAGER_SERVICE);
                          v = vm != null ? vm.getDefaultVibrator() : null;
                      } else {
                          v = (android.os.Vibrator) getSystemService(android.content.Context.VIBRATOR_SERVICE);
                      }
                      if (v == null || !v.hasVibrator()) return;
                      String k = kind == null ? "tap" : kind;
                      long[] t = null; int[] a = null;
                      if ("success".equals(k)) { t = new long[] { 0, 35, 70, 45, 70, 80 }; a = new int[] { 0, 180, 0, 210, 0, 255 }; }
                      else if ("warn".equals(k)) { t = new long[] { 0, 60, 60, 60 }; a = new int[] { 0, 255, 0, 255 }; }
                      else if ("add".equals(k)) { t = new long[] { 0, 24, 45, 34 }; a = new int[] { 0, 170, 0, 255 }; }
                      if (t == null) {
                          if (Build.VERSION.SDK_INT >= 29) v.vibrate(android.os.VibrationEffect.createPredefined(android.os.VibrationEffect.EFFECT_CLICK));
                          else if (Build.VERSION.SDK_INT >= 26) v.vibrate(android.os.VibrationEffect.createOneShot(16, android.os.VibrationEffect.DEFAULT_AMPLITUDE));
                          else v.vibrate(16);
                          return;
                      }
                      if (Build.VERSION.SDK_INT >= 26) {
                          if (v.hasAmplitudeControl()) v.vibrate(android.os.VibrationEffect.createWaveform(t, a, -1));
                          else v.vibrate(android.os.VibrationEffect.createWaveform(t, -1));
                      } else {
                          v.vibrate(t, -1);
                      }
                  } catch (Exception e) { /* الاهتزاز مش أساسي */ }
              }

              /* أندرويد 13 وأحدث: لازم العميل يوافق على الإشعارات - بنسأله مرة واحدة
                 بس، أول ما يحط منتج في السلة. */
              private void askNotificationPermissionOnce() {
                  if (Build.VERSION.SDK_INT < 33) return;
                  if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED) return;
                  android.content.SharedPreferences sp = getSharedPreferences(CartReminderJob.PREFS, MODE_PRIVATE);
                  if (sp.getBoolean("asked_notif", false)) return;
                  sp.edit().putBoolean("asked_notif", true).apply();
                  requestPermissions(new String[]{ Manifest.permission.POST_NOTIFICATIONS }, 2001);
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  foreground = true;
                  CartReminderJob.cancelAll(this);
              }

              @Override
              protected void onStop() {
                  foreground = false;
                  CartReminderJob.scheduleReminders(this);
                  super.onStop();
              }

              private static void setHeight(View v, int h) {
                  ViewGroup.LayoutParams lp = v.getLayoutParams();
                  if (lp != null && lp.height != h) { lp.height = h; v.setLayoutParams(lp); }
              }

              private String startUrl(Intent intent) {
                  String open = intent != null ? intent.getStringExtra("aa_open") : null;
                  if ("cart".equals(open) || "clearcart".equals(open)) return HOME + "&aa_open=" + open;
                  Uri data = intent != null ? intent.getData() : null;
                  if (data != null && isOwnSite(data)) return data.toString();
                  return HOME;
              }

              private static boolean isOwnSite(Uri u) {
                  String scheme = u.getScheme();
                  String host = u.getHost();
                  return ("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme))
                      && host != null && (host.equalsIgnoreCase(HOST) || host.toLowerCase().endsWith("." + HOST));
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setTextZoom(100);
                  s.setSupportZoom(false);
                  s.setAllowFileAccess(false);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUserAgentString(s.getUserAgentString() + " AlAbdoApp/4");
                  CookieManager.getInstance().setAcceptCookie(true);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
              web.addJavascriptInterface(new SplashBridge(), "AlAbdoNative");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl());
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          /* نسخة قديمة من الموقع (من غير appReady)؟ نقفل الشاشة على طول */
                          if (splashHidden) return;
                          view.evaluateJavascript("window.AA_SPLASH===1", new ValueCallback<String>() {
                              @Override public void onReceiveValue(String v) { if (!"true".equals(v)) hideSplash(); }
                          });
                      }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) showOffline();
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          return openFileChooser(callback, params);
                      }
                      /* أي رسالة تأكيد/تنبيه من الصفحة: بشكل التطبيق، من غير "The page at ... displays" */
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final android.webkit.JsResult result) {
                          new android.app.AlertDialog.Builder(view.getContext(), android.R.style.Theme_DeviceDefault_Light_Dialog_Alert)
                              .setMessage(message)
                              .setPositiveButton("تمام", (d, w) -> result.confirm())
                              .setOnCancelListener(d -> result.cancel())
                              .show();
                          return true;
                      }
                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final android.webkit.JsResult result) {
                          new android.app.AlertDialog.Builder(view.getContext(), android.R.style.Theme_DeviceDefault_Light_Dialog_Alert)
                              .setMessage(message)
                              .setPositiveButton("تمام", (d, w) -> result.confirm())
                              .setNegativeButton("إلغاء", (d, w) -> result.cancel())
                              .setOnCancelListener(d -> result.cancel())
                              .show();
                          return true;
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> openExternal(Uri.parse(url)));
              }

              /* لينكات الموقع بتفضل جوه التطبيق، وأي حاجة تانية بتفتح برّه */
              private boolean handleUrl(Uri u) {
                  if (u == null) return false;
                  if (isOwnSite(u)) return false;
                  String scheme = u.getScheme() == null ? "" : u.getScheme().toLowerCase();
                  if (scheme.equals("intent")) {
                      try {
                          Intent i = Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME);
                          try { startActivity(i); }
                          catch (ActivityNotFoundException e) {
                              String fb = i.getStringExtra("browser_fallback_url");
                              if (fb != null) openExternal(Uri.parse(fb));
                          }
                      } catch (Exception e) { /* ignore */ }
                      return true;
                  }
                  openExternal(u);
                  return true;
              }

              private void openExternal(Uri u) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, u);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) { /* no app for this link */ }
              }

              private void showOffline() {
                  String html = "<!doctype html><html dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>"
                      + "<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;"
                      + "font-family:sans-serif;background:#fff8ef;color:#2a1f3d;text-align:center;padding:24px;box-sizing:border-box}"
                      + "b{font-size:20px}p{margin:0;color:#6b6080}button{border:0;border-radius:999px;background:#ee1f6c;color:#fff;font-size:16px;font-weight:700;padding:12px 28px}</style></head>"
                      + "<body><div style='font-size:52px'>📶</div><b>مفيش اتصال بالإنترنت</b><p>اتأكد إن النت شغال وجرّب تاني</p>"
                      + "<button onclick=\"location.href='" + HOME + "'\">حاول تاني</button></body></html>";
                  web.loadDataWithBaseURL(null, html, "text/html", "utf-8", null);
                  hideSplash();
              }

              /* اختيار صورة (سكرين شوت التحويل مثلاً) من المعرض أو تصويرها بالكاميرا */
              private boolean openFileChooser(ValueCallback<Uri[]> callback, WebChromeClient.FileChooserParams params) {
                  if (fileCallback != null) fileCallback.onReceiveValue(null);
                  fileCallback = callback;
                  boolean imagesOnly = true;
                  String[] types = params.getAcceptTypes();
                  if (types != null) {
                      for (String t : types) {
                          if (t != null && t.length() > 0 && !t.startsWith("image")) { imagesOnly = false; break; }
                      }
                  }
                  Intent pick = new Intent(Intent.ACTION_GET_CONTENT);
                  pick.addCategory(Intent.CATEGORY_OPENABLE);
                  pick.setType(imagesOnly ? "image/*" : "*/*");
                  if (params.getMode() == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE) {
                      pick.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  }
                  Intent camera = null;
                  cameraUri = null;
                  if (imagesOnly) {
                      try {
                          File dir = new File(getCacheDir(), "camera");
                          if (!dir.exists()) dir.mkdirs();
                          File photo = File.createTempFile("photo_", ".jpg", dir);
                          cameraUri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", photo);
                          camera = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                          camera.putExtra(MediaStore.EXTRA_OUTPUT, cameraUri);
                          camera.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception e) { camera = null; cameraUri = null; }
                  }
                  Intent launch;
                  if (params.isCaptureEnabled() && camera != null) {
                      launch = camera;
                  } else {
                      launch = Intent.createChooser(pick, "اختار صورة");
                      if (camera != null) {
                          ArrayList<Intent> extra = new ArrayList<>();
                          extra.add(camera);
                          launch.putExtra(Intent.EXTRA_INITIAL_INTENTS, extra.toArray(new Intent[0]));
                      }
                  }
                  try {
                      startActivityForResult(launch, REQ_FILE);
                  } catch (ActivityNotFoundException e) {
                      fileCallback = null;
                      return false;
                  }
                  return true;
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILE) {
                      if (fileCallback == null) return;
                      Uri[] result = null;
                      if (resultCode == RESULT_OK) {
                          if (data != null && data.getClipData() != null && data.getClipData().getItemCount() > 0) {
                              int n = data.getClipData().getItemCount();
                              result = new Uri[n];
                              for (int i = 0; i < n; i++) result[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data != null && data.getData() != null) {
                              result = new Uri[]{ data.getData() };
                          } else if (cameraUri != null) {
                              result = new Uri[]{ cameraUri };
                          }
                      }
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              private void goBackOrClose() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else finish();
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  /* جاي من إشعار السلة والتطبيق مفتوح: نفتح السلة من غير ما نعيد تحميل الصفحة */
                  final String open = intent != null ? intent.getStringExtra("aa_open") : null;
                  if ("cart".equals(open) || "clearcart".equals(open)) {
                      web.evaluateJavascript("window.aaNotifOpen ? aaNotifOpen('" + open + "') : location.replace('" + HOME + "&aa_open=" + open + "')", null);
                      return;
                  }
                  Uri data = intent != null ? intent.getData() : null;
                  if (data != null && isOwnSite(data)) web.loadUrl(data.toString());
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }

              @Override
              protected void onPause() {
                  web.onPause();
                  CookieManager.getInstance().flush();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) { web.stopLoading(); web.destroy(); }
                  super.onDestroy();
              }
          }
