                  if (!canNotify(c)) { try { checkNotes(c); } catch (Exception e) { /* ignore */ } return; }
                  SharedPreferences sp = c.getSharedPreferences(PREFS, MODE_PRIVATE);
                  long since = sp.getLong("since", 0L);
                  long floor = System.currentTimeMillis() - 3L * 24L * 60L * 60L * 1000L;
                  if (since < floor) since = floor;
                  HttpURLConnection con = (HttpURLConnection) new URL(API + since).openConnection();
                  con.setConnectTimeout(15000);
