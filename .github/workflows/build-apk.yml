              static synchronized void checkNotes(Context c) throws Exception {
                  SharedPreferences sp = c.getSharedPreferences(PREFS, MODE_PRIVATE);
                  String cid = sp.getString("cid", ""), cpass = sp.getString("cpass", "");
                  if (cid.length() == 0 || cpass.length() == 0) return;
