# دوري — تجهيز صفحة App Store (الوصف، الكلمات، الصور، التصنيف، بيانات المراجعة، النسخة)
# بيستخدم نفس أسرار أبل (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8). الرقم السري لحساب المراجع
# بيكتبه صاحب الحساب بنفسه في App Store Connect — مبيتكتبش هنا.
name: Dory App Store metadata

on:
  workflow_dispatch:
    inputs:
      demo_user:
        description: "Reviewer sign-in phone number (no password here)"
        default: ""
      version:
        description: "Version string (e.g. 2.59.0)"
        default: ""
      submit:
        description: "yes = submit for App Review; replace = pull back the waiting version and submit this one"
        default: "no"
  push:
    branches: [main]
    paths: [".github/workflows/dory-asc-metadata.yml", ".github/dory/asc_metadata.py"]

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill App Store Connect
        env:
          K1: ${{ secrets.ASC_KEY_ID }}
          K2: ${{ secrets.ASC_ISSUER_ID }}
          K3: ${{ secrets.ASC_KEY_P8 }}
          DEMO_USER: ${{ inputs.demo_user }}
          VERSION: ${{ inputs.version }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          pip3 install --quiet pyjwt cryptography
          printf '%s\n' "$K3" > "$RUNNER_TEMP/k.p8"
          python3 .github/dory/asc_metadata.py 2>&1 | tee "$RUNNER_TEMP/report.txt"
          rm -f "$RUNNER_TEMP/k.p8"

      - name: Save report (branch dory-asc-report)
        if: always()
        run: |
          mkdir -p r && cd r && git init -q
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/report.txt" report.txt 2>/dev/null || echo "no report" > report.txt
          git add . && git commit -q -m "report $(date -u)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/dory-asc-report
